# A new app release (v<version>, made by build.yml) to Google Play: its bundle (Trackhop-v<version>-play.aab)
# uploaded to a track with the release notes written for Play in play/whatsnew/<versionCode>/
# (whatsnew-en-US, whatsnew-it-IT…; never the F-Droid changelogs, which name what the Play build
# leaves out). Without notes for that versionCode the upload goes without any.
# Called by build.yml after a new release; by hand (Actions › Google Play › Run workflow) for any tag.
# Skipped until the PLAY_SERVICE_ACCOUNT_JSON secret exists (packaging/README.md says how to make it).
# The track is the PLAY_TRACK variable (default "alpha", the closed testing track Play creates first;
# a closed track renamed in Play Console has its own name), the rollout PLAY_STATUS (default completed).
name: Google Play

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'App release tag, e.g. v1.5.7'
        type: string
        required: true

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      HAS_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: No PLAY_SERVICE_ACCOUNT_JSON
        if: ${{ env.HAS_KEY != 'true' }}
        run: |
          echo "::notice::PLAY_SERVICE_ACCOUNT_JSON is not set: $TAG was not sent to Google Play (packaging/README.md, Google Play)."

      # The notes come from the branch this runs on (main): they may be written after the tag.
      - uses: actions/checkout@v7
        if: ${{ env.HAS_KEY == 'true' }}

      - name: The release's bundle and its Play notes
        id: files
        if: ${{ env.HAS_KEY == 'true' }}
        run: |
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "Trackhop-$TAG-play.aab" --dir dist
          git fetch -q --depth 1 origin "refs/tags/$TAG:refs/tags/$TAG"
          code=$(git show "$TAG:android/app/build.gradle" | sed -n 's/.*versionCode \([0-9]*\).*/\1/p' | head -1)
          echo "Version code $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ -n "$code" ] && ls "play/whatsnew/$code"/whatsnew-* >/dev/null 2>&1; then
            echo "notes=play/whatsnew/$code" >> "$GITHUB_OUTPUT"
            ls "play/whatsnew/$code"
          else
            echo "::warning::No Play notes in play/whatsnew/$code: uploaded without release notes."
          fi

      # Play refuses a versionCode it has already (a re-run, or an upload made by hand): then there is
      # nothing to do, and the run stays green. If Play cannot be asked, the upload goes ahead as before.
      - name: Already on Google Play?
        id: play
        if: ${{ env.HAS_KEY == 'true' && steps.files.outputs.code != '' }}
        env:
          KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          CODE: ${{ steps.files.outputs.code }}
        run: |
          pip install -q google-auth requests || exit 0
          python3 - <<'PY' || true
          import json, os
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession
          creds = service_account.Credentials.from_service_account_info(
              json.loads(os.environ["KEY"]), scopes=["https://www.googleapis.com/auth/androidpublisher"])
          s = AuthorizedSession(creds)
          base = "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/com.xlollx.songport/edits"
          r = s.post(base); r.raise_for_status(); edit = r.json()["id"]
          try:
              codes = set()
              for kind in ("bundles", "apks"):
                  r = s.get(f"{base}/{edit}/{kind}"); r.raise_for_status()
                  codes |= {int(x["versionCode"]) for x in r.json().get(kind, [])}
          finally:
              s.delete(f"{base}/{edit}")
          code = int(os.environ["CODE"])
          print(f"Version codes on Play: {max(codes) if codes else 'none'} at most; this release: {code}")
          if code in codes:
              with open(os.environ["GITHUB_OUTPUT"], "a") as f: f.write("present=true\n")
          PY

      - name: Already there
        if: ${{ steps.play.outputs.present == 'true' }}
        run: |
          echo "::notice::Google Play has version code ${{ steps.files.outputs.code }} already: $TAG not uploaded again."

      - name: Upload with release notes
        if: ${{ env.HAS_KEY == 'true' && steps.files.outputs.notes != '' && steps.play.outputs.present != 'true' }}
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.xlollx.songport
          releaseFiles: dist/*.aab
          releaseName: ${{ inputs.tag }}
          tracks: ${{ vars.PLAY_TRACK || 'alpha' }}
          status: ${{ vars.PLAY_STATUS || 'completed' }}
          whatsNewDirectory: ${{ steps.files.outputs.notes }}

      - name: Upload without release notes
        if: ${{ env.HAS_KEY == 'true' && steps.files.outputs.notes == '' && steps.play.outputs.present != 'true' }}
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.xlollx.songport
          releaseFiles: dist/*.aab
          releaseName: ${{ inputs.tag }}
          tracks: ${{ vars.PLAY_TRACK || 'alpha' }}
          status: ${{ vars.PLAY_STATUS || 'completed' }}
