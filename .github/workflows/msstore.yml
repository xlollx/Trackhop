# A new Trackhop Desktop release (server-v<version>, made by desktop.yml) to the Microsoft Store: the
# release's .msix uploaded to the product with the Microsoft Store Developer CLI (msstore) and the
# submission sent to certification (a pending draft in Partner Center is replaced by a new one made
# from the last published submission, as msstore publish does).
# Called by desktop.yml after a new release; by hand (Actions › Microsoft Store › Run workflow) to send
# a release again, optionally as a draft to finish in Partner Center.
# Skipped until the four secrets exist: MSSTORE_TENANT_ID, MSSTORE_SELLER_ID, MSSTORE_CLIENT_ID,
# MSSTORE_CLIENT_SECRET (an Entra ID app with the Manager role in Partner Center: packaging/README.md).
name: Microsoft Store

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: 'Version already released as server-v<version>, e.g. 0.6.2'
        type: string
        required: true
      draft:
        description: 'Leave the submission as a draft (finish it in Partner Center)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write   # the reminder issue when the package goes up by hand

jobs:
  publish:
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version }}
      HAS_KEYS: ${{ secrets.MSSTORE_TENANT_ID != '' && secrets.MSSTORE_SELLER_ID != '' && secrets.MSSTORE_CLIENT_ID != '' && secrets.MSSTORE_CLIENT_SECRET != '' }}
      PRODUCT_ID: ${{ vars.MSSTORE_PRODUCT_ID || '9PFX74Q2XN9P' }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: No Partner Center keys
        if: ${{ env.HAS_KEYS != 'true' }}
        run: |
          Write-Output "::notice::The MSSTORE_* secrets are not all set: server-v$env:VERSION was not sent to the Microsoft Store (packaging/README.md, Microsoft Store)."

      # An individual Partner Center account cannot have the Entra application the API needs, so the
      # package goes up by hand: an issue assigned to the owner says so, with the file and the steps.
      - name: Reminder to upload by hand
        if: ${{ env.HAS_KEYS != 'true' }}
        run: |
          $title = "Microsoft Store: upload Trackhop Desktop $env:VERSION"
          $open = gh issue list --repo "$env:GITHUB_REPOSITORY" --state open --search $title --json title | ConvertFrom-Json | Where-Object { $_.title -eq $title }
          if ($open) { Write-Output "Already open: $title"; exit 0 }
          $msix = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/server-v$env:VERSION/Trackhop-Desktop-v$env:VERSION-windows.msix"
          $body = @"
          Trackhop Desktop **$env:VERSION** is out; the Microsoft Store still has the previous version.

          1. Download the package: $msix
          2. Open [Partner Center › Apps and games](https://partner.microsoft.com/dashboard/apps-and-games/overview) › **Trackhop Desktop** › **Update** (start a new submission).
          3. **Packages**: remove the old ``.msix``, upload this one, **Save**.
          4. Wait for the package check, then **Submit for certification**.

          Close this issue once it is submitted.
          "@
          gh issue create --repo "$env:GITHUB_REPOSITORY" --title $title --body $body --assignee "$env:GITHUB_REPOSITORY_OWNER"

      - name: The release's package
        if: ${{ env.HAS_KEYS == 'true' }}
        run: |
          gh release download "server-v$env:VERSION" --repo "$env:GITHUB_REPOSITORY" --pattern "*-windows.msix" --dir dist
          Get-ChildItem dist

      - name: Microsoft Store Developer CLI
        if: ${{ env.HAS_KEYS == 'true' }}
        uses: microsoft/microsoft-store-apppublisher@v1.4

      - name: Upload and submit
        if: ${{ env.HAS_KEYS == 'true' }}
        env:
          TENANT: ${{ secrets.MSSTORE_TENANT_ID }}
          SELLER: ${{ secrets.MSSTORE_SELLER_ID }}
          CLIENT: ${{ secrets.MSSTORE_CLIENT_ID }}
          SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          DRAFT: ${{ inputs.draft && 'true' || 'false' }}
        run: |
          msstore reconfigure --tenantId $env:TENANT --sellerId $env:SELLER --clientId $env:CLIENT --clientSecret $env:SECRET
          $msix = (Get-ChildItem dist -Filter *.msix | Select-Object -First 1).FullName
          if ($env:DRAFT -eq 'true') { msstore publish $msix -id $env:PRODUCT_ID --noCommit }
          else { msstore publish $msix -id $env:PRODUCT_ID }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
