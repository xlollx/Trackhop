# The site's data that comes from the repository (scripts/site_data.py):
# - services: docs/_data/services.yml is the one source of the README's "Music services at a glance"
#   table and of trackhop.org/services. Checked on every pull request and push: if the README's table
#   was edited by hand, or services.yml without running the script, this fails and says what to run.
# - releases: docs/_data/releases.json (trackhop.org/whats-new and its RSS feeds), from the fastlane
#   notes, server/CHANGELOG.md and the release tags. Rewritten after each release build and straight
#   to main when it changed (as the supporters' list is), then the site is rebuilt.
# - download links: the Desktop links of the README, the site's home page and the Desktop guide, moved
#   to the newest Desktop release that is out (scripts/download_links.py; every link is checked first),
#   in the same commit. The app, the Bridge and the badges link to releases/latest and need nothing.
name: Site data

on:
  pull_request:
    paths: [docs/_data/services.yml, README.md, scripts/site_data.py]
  push:
    branches: [main]
    paths: [docs/_data/services.yml, README.md, scripts/site_data.py, server/CHANGELOG.md, 'fastlane/metadata/android/*/changelogs/**']
  workflow_run:
    workflows: [Build, Desktop]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: site-data-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  services:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: pip install --quiet pyyaml
      - name: README table matches services.yml
        run: python3 scripts/site_data.py services --check

  releases:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          # main takes pushes only through a pull request or from the ruleset's bypass list, where the
          # workflow's own token is not: the deploy key BOT_DEPLOY_KEY is (26/11).
          ssh-key: ${{ secrets.BOT_DEPLOY_KEY }}
      - name: Release notes
        run: python3 scripts/site_data.py releases
      - name: Download links
        # A link that doesn't answer stops only this step: what's new is still published.
        continue-on-error: true
        run: python3 scripts/download_links.py
      - name: Publish
        run: |
          files="docs/_data/releases.json README.md docs/guide/desktop.md docs/_includes/home.html"
          if git diff --quiet -- $files; then echo "Nothing new."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $files
          msg="Site: what's new"
          git diff --cached --quiet -- docs/_data/releases.json && msg="Site: download links"
          git diff --cached --quiet -- README.md docs/guide/desktop.md docs/_includes/home.html || [ "$msg" = "Site: download links" ] || msg="$msg and download links"
          git commit -m "$msg [skip ci]"
          for i in 1 2 3; do git pull --rebase -q origin main && git push origin HEAD:main && break; sleep 5; done
          # [skip ci] keeps Build and CodeQL from running on a data commit; the site's build is asked for here.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" > /dev/null || true
