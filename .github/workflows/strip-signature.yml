# Takes the "Generated by Claude Code" signature off the maintainer's own comments. The tool Claude
# posts with adds it on its own, even when the text has none, and the maintainer does not want it in
# the text (26/11/2026). It runs on every new or edited comment and discussion comment of the
# maintainer, and by hand over the last days' comments. Only the maintainer's comments are touched,
# only the signature lines are removed, and no code from the repository is run.
name: Strip signature

on:
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  discussion_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      days:
        description: 'Clean the maintainer comments of the last N days'
        default: '7'

permissions:
  issues: write
  pull-requests: write
  discussions: write

concurrency:
  group: strip-signature-${{ github.event.comment.id || github.run_id }}

jobs:
  strip:
    # Only the owner's comments, and only when the signature is there (an edit made here does not
    # start the workflow again: the workflow's own token does not trigger workflows).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.comment.user.login == github.repository_owner &&
       contains(github.event.comment.body, 'Generated by [Claude Code]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      EVENT: ${{ github.event_name }}
      COMMENT_ID: ${{ github.event.comment.id }}
      NODE_ID: ${{ github.event.comment.node_id }}
      DAYS: ${{ inputs.days || '7' }}
    steps:
      - name: Strip
        run: |
          # The text without the trailing signature: "---" then "_Generated by [Claude Code](…)_", or
          # the "🤖 Generated with [Claude Code](…)" line; nothing else changes.
          clean() {
            python3 -c '
          import re, sys
          t = sys.stdin.read()
          pat = r"(\s*\n)?(-{3,}\s*\n)?\s*(_Generated by \[Claude Code\]\([^)]*\)_|🤖 Generated with \[Claude Code\]\([^)]*\))\s*$"
          print(re.sub(pat, "", t).rstrip(), end="")'
          }
          fix_rest() { # $1 = API path of the comment
            body=$(gh api "$1" --jq .body)
            new=$(printf '%s' "$body" | clean)
            if [ "$new" != "$body" ]; then
              jq -n --arg b "$new" '{body: $b}' | gh api -X PATCH "$1" --input - > /dev/null && echo "cleaned $1"
            fi
          }
          case "$EVENT" in
            issue_comment) fix_rest "repos/$REPO/issues/comments/$COMMENT_ID" ;;
            pull_request_review_comment) fix_rest "repos/$REPO/pulls/comments/$COMMENT_ID" ;;
            discussion_comment)
              body=$(gh api graphql -f id="$NODE_ID" -f query='query($id: ID!) { node(id: $id) { ... on DiscussionComment { body } } }' --jq .data.node.body)
              new=$(printf '%s' "$body" | clean)
              if [ "$new" != "$body" ]; then
                gh api graphql -f id="$NODE_ID" -f body="$new" -f query='mutation($id: ID!, $body: String!) { updateDiscussionComment(input: {commentId: $id, body: $body}) { comment { id } } }' > /dev/null && echo "cleaned discussion comment"
              fi ;;
            workflow_dispatch)
              since=$(date -u -d "$DAYS days ago" +%Y-%m-%dT%H:%M:%SZ)
              for kind in issues pulls; do
                gh api --paginate "repos/$REPO/$kind/comments?since=$since&per_page=100" \
                  --jq ".[] | select(.user.login == \"$OWNER\" and (.body | contains(\"Generated by [Claude Code]\"))) | .url" |
                  while read -r url; do fix_rest "${url#https://api.github.com/}"; done
              done ;;
          esac
