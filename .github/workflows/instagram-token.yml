# Instagram's access token lasts 60 days: once a month it is renewed (it must be at least a day old).
# When Instagram answers with the same token, nothing else is needed. When it answers with a new
# one, it is saved as the INSTAGRAM_TOKEN secret if a GH_SECRETS_TOKEN secret exists (a fine-grained
# token for this repository with "Secrets: read and write" only); otherwise the run fails, so the
# owner sees it in time and pastes the new token by hand.
name: Instagram token

on:
  schedule:
    - cron: '17 6 3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Renew
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          [ -n "$INSTAGRAM_TOKEN" ] || { echo "No INSTAGRAM_TOKEN: nothing to renew."; exit 0; }
          answer=$(curl -sS "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=$INSTAGRAM_TOKEN")
          new=$(printf '%s' "$answer" | python3 -c "import json,sys; print(json.load(sys.stdin).get('access_token',''))")
          days=$(printf '%s' "$answer" | python3 -c "import json,sys; print(int(json.load(sys.stdin).get('expires_in',0))//86400)")
          [ -n "$new" ] || { echo "Instagram did not renew the token: $(printf '%s' "$answer" | python3 -c "import json,sys; print(json.load(sys.stdin).get('error',{}).get('message',''))")"; exit 1; }
          echo "::add-mask::$new"
          echo "Renewed: valid for $days more days."
          if [ "$new" = "$INSTAGRAM_TOKEN" ]; then echo "Same token: nothing to save."; exit 0; fi
          [ -n "$GH_TOKEN" ] || { echo "Instagram gave a new token and there is no GH_SECRETS_TOKEN to save it: paste a new INSTAGRAM_TOKEN by hand."; exit 1; }
          printf '%s' "$new" | gh secret set INSTAGRAM_TOKEN --repo "$REPO"
          echo "New token saved."
