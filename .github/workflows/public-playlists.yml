# Counts the public playlists that carry "Synced with Trackhop" (Spotify and YouTube, their official
# search APIs) into the badges branch: public-playlists.json for the site and the README. Counts only.
name: Public playlists

# Off the README and the site since 20/11 (search results come and go, so the count went up and down):
# by hand only, the script and the data are kept.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: badges-public-playlists
  cancel-in-progress: false

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Count
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID || vars.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$SPOTIFY_CLIENT_SECRET" ] && [ -z "$YOUTUBE_API_KEY" ]; then
            echo "::notice::No SPOTIFY_CLIENT_SECRET or YOUTUBE_API_KEY yet: nothing to count."; exit 0
          fi
          python3 scripts/public_playlists.py out
          # Its SVG for the README at once (the hourly Downloads run redraws them all too).
          mkdir -p svg && cp out/public-playlists-badge.json svg/ && python3 scripts/badge_svg.py svg && cp svg/public-playlists-badge.svg out/
      - name: Into the badges branch
        run: |
          [ -f out/public-playlists.json ] || exit 0
          for try in 1 2 3 4; do
            rm -rf badges
            git init -q badges; cd badges
            git fetch -q --depth=1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" badges && git checkout -q -B badges FETCH_HEAD
            cp ../out/public-playlists.json ../out/public-playlists-badge.json ../out/public-playlists-badge.svg .
            git add public-playlists.json public-playlists-badge.json public-playlists-badge.svg
            git diff --cached --quiet && { echo "No change."; exit 0; }
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Public playlists"
            git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" badges && exit 0
            cd ..; sleep $((try * 5))
          done
          exit 1
