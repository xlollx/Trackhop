# Lists the Discussions updated in the last days in the run's log and summary, so the evening check
# can read new questions and ideas (GitHub's REST API has no Discussions list). Daily and by hand;
# read-only.
name: Discussions list

on:
  schedule:
    - cron: '17 17 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'How many days back'
        default: '3'

permissions:
  discussions: read
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Recent discussions
        env:
          GH_TOKEN: ${{ github.token }}
          DAYS: ${{ inputs.days || '3' }}
        run: |
          since=$(date -u -d "$DAYS days ago" +%Y-%m-%dT%H:%M:%SZ)
          gh api graphql -F owner="${{ github.repository_owner }}" -F name="${{ github.event.repository.name }}" -f query='
            query($owner: String!, $name: String!) {
              repository(owner: $owner, name: $name) {
                discussions(first: 30, orderBy: {field: UPDATED_AT, direction: DESC}) {
                  nodes { number title url updatedAt createdAt author { login } category { name }
                          comments(last: 1) { totalCount nodes { author { login } createdAt } } }
                }
              }
            }' --jq ".data.repository.discussions.nodes[] | select(.updatedAt >= \"$since\")
              | \"#\(.number) [\(.category.name)] \(.title) — by \(.author.login // \"ghost\"), created \(.createdAt), updated \(.updatedAt), comments \(.comments.totalCount), last comment by \(.comments.nodes[0].author.login // \"-\") \(.url)\"" > recent.txt || true
          n=$(grep -c . recent.txt || true)
          echo "DISCUSSIONS_RECENT=$n since $since"
          cat recent.txt
          { echo "### Discussions updated since $since: $n"; echo '```'; cat recent.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
