name: Desktop

# Trackhop Desktop (docs/guide/desktop.md): the server's engine and pages packed as an app
# with its own Java runtime, by server/desktop/package.sh. Windows: an MSI (per-user, no
# administrator) and a portable ZIP; Linux: a .deb and a tar.gz for any distribution. Every run keeps
# them as artifacts; on main, a new server/VERSION gets its own release, server-v<version>, with
# them (the Docker image of the same version comes from server.yml).
on:
  push:
    paths:
      - 'server/**'
      - 'android/core/**'
      - 'android/ytm/**'
      - 'android/bridge/src/main/java/**'
      - 'android/app/src/main/res/**'
      - 'android/app/build.gradle'
      - 'packaging/msix/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'server/**'
      - 'android/core/**'
      - 'android/ytm/**'
      - 'android/bridge/src/main/java/**'
      - 'android/app/src/main/res/**'
      - 'android/app/build.gradle'
      - 'packaging/msix/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        # macOS twice: Apple silicon (macos-latest) and Intel, one .dmg each. Linux twice too: x86_64 and
        # 64-bit ARM (Raspberry Pi 4/5, ARM laptops), a .deb and a .tar.gz each. Linux on Ubuntu 22.04:
        # jpackage writes the .deb's dependencies from the build system's packages, and 24.04's
        # (libasound2t64…) do not exist on Debian 12 / Raspberry Pi OS Bookworm or Ubuntu 22.04, while
        # 22.04's names are understood by the newer ones too.
        os: [ ubuntu-22.04, ubuntu-22.04-arm, windows-latest, macos-latest, macos-15-intel ]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 21 (jpackage)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: WiX 3 (MSI)
        if: runner.os == 'Windows'
        run: |
          choco install wixtoolset --no-progress -y
          echo "C:\\Program Files (x86)\\WiX Toolset v3.14\\bin" >> "$GITHUB_PATH"

      - name: fakeroot (deb)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -q fakeroot

      - name: Tests and build
        # The tests on Linux x86_64 and Windows only: the other packages run the same JVM code (and
        # server.yml tests it too), so the Macs and Linux ARM only build.
        run: gradle -p server ${{ (matrix.os == 'ubuntu-22.04' || matrix.os == 'windows-latest') && 'test' || '' }} installDist desktopLibs --no-daemon --stacktrace

      - name: Package
        run: server/desktop/package.sh

      - name: The .deb installs on older systems too
        # No time64 package names (libasound2t64…) in its dependencies: Bookworm and 22.04 lack them.
        if: runner.os == 'Linux'
        run: |
          for deb in dist/*.deb; do
            deps=$(dpkg-deb -f "$deb" Depends); echo "$deb: $deps"
            if echo "$deps" | grep -q 't64'; then echo "::error::$deb depends on a time64 package name"; exit 1; fi
          done

      - name: The .deb installs on a system without a desktop
        # Raspberry Pi OS Lite, a server: no menu directories, so xdg-desktop-menu fails there. The
        # package must still configure (server/desktop/deb) and come off again. A bare Debian, its
        # dependencies from apt as a user would get them.
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" debian:bookworm-slim sh -euc '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -q
            dpkg -i /dist/*.deb || true
            apt-get install -f -y -q --no-install-recommends
            test ! -d /usr/share/desktop-directories || echo "note: this image has a menu directory"
            dpkg-query -W -f="\${Status}\n" trackhop | grep -qx "install ok installed"
            test -z "$(dpkg --audit)"
            test -x /opt/trackhop/bin/Trackhop
            dpkg -r trackhop
            ! dpkg-query -W -f="\${Status}\n" trackhop 2>/dev/null | grep -q " installed"
          '

      - name: The .zip uses "/" in its names
        # The zip format wants "/": with "\" unzip tools outside Windows make files, not folders. The
        # names as stored, read from the central directory (Python's zipfile turns "\" into "/" on Windows).
        if: runner.os == 'Windows'
        run: |
          python - dist/*-windows.zip <<'PY'
          import struct, sys
          data = open(sys.argv[1], "rb").read()
          end = data.rfind(b"PK\x05\x06")
          count, size, at = struct.unpack("<HII", data[end + 10:end + 20])
          names = []
          for _ in range(count):
              assert data[at:at + 4] == b"PK\x01\x02", "bad central directory"
              n, e, c = struct.unpack("<HHH", data[at + 28:at + 34])
              names.append(data[at + 46:at + 46 + n].decode("utf-8", "replace"))
              at += 46 + n + e + c
          bad = [n for n in names if "\\" in n or not n.startswith("Trackhop/")]
          print(len(names), "entries")
          if not names or bad:
              sys.exit("::error::entries not under Trackhop/ with \"/\": " + ", ".join(bad[:10]))
          if "Trackhop/Trackhop.exe" not in names:
              sys.exit("::error::Trackhop/Trackhop.exe missing from the zip")
          PY

      - name: MSIX (Microsoft Store)
        # Unsigned: the Store signs it. The identity is Partner Center's (Product identity), kept as
        # repository variables; the defaults only make a package to try out.
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME || 'xlollx.TrackhopDesktop' }}
          PUBLISHER: ${{ vars.MSIX_PUBLISHER || 'CN=6C91EA3D-59AB-47BA-8ACB-5DF74CE63DDF' }}
          PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME || 'xlollx' }}
        run: >-
          ./packaging/msix/build.ps1 -IdentityName $env:IDENTITY_NAME -Publisher $env:PUBLISHER
          -PublisherDisplayName $env:PUBLISHER_DISPLAY_NAME

      - name: Starts and answers
        # The packed app on its own runtime: it serves its pages on 127.0.0.1, its command line finds
        # it with nothing set up, and it stops from the page.
        env:
          APPDATA: ${{ runner.temp }}/appdata
          XDG_DATA_HOME: ${{ runner.temp }}/appdata
        run: |
          out=server/build/desktop/out
          case "$RUNNER_OS" in
            Windows) app=$out/Trackhop/Trackhop.exe; cli=$out/Trackhop/trackhop-cli.exe ;;
            macOS) app=$out/Trackhop.app/Contents/MacOS/Trackhop; cli=$out/Trackhop.app/Contents/MacOS/trackhop-cli ;;
            *) app=$out/Trackhop/bin/Trackhop; cli=$out/Trackhop/bin/trackhop-cli ;;
          esac
          "$app" --background &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8642/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8642/ -o page.html && grep -q "Trackhop Desktop" page.html
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' http://127.0.0.1:8642/)" = 403
          "$cli" status | tee cli.txt
          grep -q "0 syncs" cli.txt
          curl -sf -X POST -H "Origin: http://127.0.0.1:8642" http://127.0.0.1:8642/quit > /dev/null
          sleep 3
          ! curl -sf -m 3 http://127.0.0.1:8642/health

      - name: Keep as artifact
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: Trackhop-Desktop-${{ runner.os }}${{ (runner.os == 'macOS' || runner.arch == 'ARM64') && format('-{0}', runner.arch) || '' }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  flatpak:
    # On main, the Flatpak bundle for the release (flatpak.yml: built from source, as Flathub would).
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/flatpak.yml

  release:
    # On main, a server version without its release yet: the release "server-v<version>" with the
    # files of both systems, the Flatpak and the notes of server/CHANGELOG.md. A prerelease, never
    # "latest": the app's releases (v<version>) stay the ones Obtainium and the site's links pick.
    # A failed Flatpak does not hold the release back: it goes out without the bundle.
    needs: [ package, flatpak ]
    if: ${{ !cancelled() && needs.package.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      # Set when this run made the release, or when it exists already for this same commit (a re-run
      # of the jobs after it), for the stores job and the others after it.
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Files of both systems
        uses: actions/download-artifact@v8
        with:
          pattern: Trackhop-Desktop-*
          path: dist
          merge-multiple: true

      - name: Flatpak
        if: ${{ needs.flatpak.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: Trackhop-Flatpak
          path: flatpak

      - name: Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(tr -d '[:space:]' < server/VERSION)
          tag="server-v$v"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag is out already."
            # A Flatpak that failed on the release's run and built on a later one joins the release it is missing from.
            f="Trackhop-Desktop-v$v-linux.flatpak"
            if [ -f flatpak/Trackhop.flatpak ] && ! gh release view "$tag" --json assets -q '.assets[].name' | grep -qx "$f"; then
              mv flatpak/Trackhop.flatpak "$f" && gh release upload "$tag" "$f" && echo "$f added to $tag."
            fi
            # Made from this very commit (a re-run): the jobs after it still get the version.
            target=$(gh release view "$tag" --json targetCommitish -q .targetCommitish)
            if [ "$target" = "$GITHUB_SHA" ]; then echo "version=$v" >> "$GITHUB_OUTPUT"; fi
            exit 0
          fi
          if [ -f flatpak/Trackhop.flatpak ]; then mv flatpak/Trackhop.flatpak "dist/Trackhop-Desktop-v$v-linux.flatpak"; fi
          # This version's section of server/CHANGELOG.md, without its heading.
          awk -v v="$v" '/^## /{p = ($2 == v)} p && !/^## /' server/CHANGELOG.md > notes.md
          cat >> notes.md <<EOF

          **Docker:** \`docker pull ghcr.io/xlollx/trackhop:$v\` (or \`:latest\`). [Docker guide](https://trackhop.org/guide/docker) · [Desktop guide](https://trackhop.org/guide/desktop)

          *A stable release:* GitHub shows it as a pre-release only so that the repository's "latest" release stays the Android app, which app stores and updaters (Obtainium, F-Droid) read from it.

          The \`.msix\` is the package for the Microsoft Store, unsigned: it does not install by itself; use the \`.msi\` or the \`.zip\`.

          **macOS:** \`-macos-arm64.dmg\` for Apple silicon (M1 and later), \`-macos-x64.dmg\` for Intel Macs. Not signed by Apple: the first time, macOS refuses to open it; then *System Settings › Privacy & Security › Open Anyway* ([how](https://trackhop.org/guide/desktop#macos)).

          **Linux:** \`-linux.deb\` and \`-linux.tar.gz\` for usual PCs (x86_64), \`-linux-arm64.deb\` and \`-linux-arm64.tar.gz\` for 64-bit ARM: Raspberry Pi 4 and 5 with a 64-bit system, ARM laptops.

          **Flatpak (Linux):** \`flatpak install --user Trackhop-Desktop-v$v-linux.flatpak\`, then *Trackhop* in the menu (needs Flathub's GNOME runtime, which Flatpak offers to install).
          EOF
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Trackhop Desktop & Server $v" --notes-file notes.md
          echo "version=$v" >> "$GITHUB_OUTPUT"

  stores:
    # The new release to winget, Chocolatey and the AUR (stores.yml; each skipped until its secret exists).
    # Here rather than on the release event: a release made with the workflow's own token starts no
    # other workflow.
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.release.outputs.version != '' }}
    uses: ./.github/workflows/stores.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit

  sourceforge:
    # The new release's files as SourceForge's default downloads (sourceforge.yml), once SourceForge's
    # webhook has copied them. Skipped until SOURCEFORGE_API_KEY exists.
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.release.outputs.version != '' }}
    uses: ./.github/workflows/sourceforge.yml
    with:
      tag: server-v${{ needs.release.outputs.version }}
    secrets: inherit

  itch:
    # The new release's Windows, macOS and Linux files to Trackhop's itch.io page (itch.yml).
    # Skipped until BUTLER_API_KEY exists.
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.release.outputs.version != '' }}
    uses: ./.github/workflows/itch.yml
    with:
      tag: server-v${{ needs.release.outputs.version }}
    secrets: inherit

  telegram:
    # The new release on Trackhop's Telegram channel (telegram.yml). Skipped until TELEGRAM_BOT_TOKEN exists.
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.release.outputs.version != '' }}
    uses: ./.github/workflows/telegram.yml
    with:
      tag: server-v${{ needs.release.outputs.version }}
    secrets: inherit

  msstore:
    # The new release's .msix to the Microsoft Store (msstore.yml); without the MSSTORE_* secrets, an
    # issue reminding the owner to upload it by hand.
    needs: release
    permissions:
      contents: read
      issues: write
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.release.outputs.version != '' }}
    uses: ./.github/workflows/msstore.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit

  virustotal:
    # The new release's files checked by VirusTotal (virustotal.yml), as the app's are.
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.release.outputs.version != '' }}
    uses: ./.github/workflows/virustotal.yml
    with:
      tag: server-v${{ needs.release.outputs.version }}
    secrets: inherit
