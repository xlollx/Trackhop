# A post on Trackhop's Instagram (.github/scripts/instagram_post.py): the JPEG pictures of a folder
# in the repository (e.g. docs/social/1.16, the carousel of a major release) and its caption.txt,
# as a carousel. By hand, or started after a release once the carousel is committed.
# Skipped until the INSTAGRAM_TOKEN secret and the INSTAGRAM_USER_ID variable exist.
name: Instagram

on:
  workflow_dispatch:
    inputs:
      folder:
        description: Folder with the JPEG pictures (name order, at most 10) and caption.txt
        type: string
        required: true
      dry_run:
        description: Only check the pictures and the caption with Instagram, publish nothing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: instagram

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Post
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_USER_ID: ${{ vars.INSTAGRAM_USER_ID || secrets.INSTAGRAM_USER_ID }}
          FOLDER: ${{ inputs.folder }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python3 .github/scripts/instagram_post.py
