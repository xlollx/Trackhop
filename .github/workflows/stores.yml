name: Stores

# A Trackhop Desktop release (server-v<version>, made by desktop.yml) to the Windows package
# managers: a pull request to winget's community repository, and the Chocolatey package pushed to
# the community repository's moderation. Each part runs only once its secret exists (WINGET_TOKEN,
# CHOCOLATEY_API_KEY: packaging/README.md says how to get them); without it, it says so and stops.
# AUR: trackhop-bin, pushed with AUR_SSH_KEY. Called by desktop.yml after a new release; by hand (Actions › Stores › Run workflow) to send a
# release again. Scoop's bucket updates itself (its Excavator), Flathub and the Microsoft Store by
# hand (packaging/README.md).
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: 'Version already released as server-v<version>, e.g. 0.5.1'
        type: string
        required: true
      winget:
        description: 'Open the winget pull request'
        type: boolean
        default: true
      chocolatey:
        description: 'Push the Chocolatey package'
        type: boolean
        default: true
      aur:
        description: 'Push trackhop-bin to the AUR'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  winget:
    # Needs one version of xlollx.Trackhop already in microsoft/winget-pkgs (the first is a manual
    # pull request) and a fork of winget-pkgs under xlollx; WINGET_TOKEN is a classic token with
    # public_repo (and workflow, to keep the fork in sync).
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.winget }}
    runs-on: ubuntu-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: No WINGET_TOKEN
        if: env.WINGET_TOKEN == ''
        run: 'echo "::notice::winget skipped, no WINGET_TOKEN secret yet (packaging/README.md)"'

      - name: Pull request to winget-pkgs
        if: env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        with:
          identifier: xlollx.Trackhop
          version: ${{ inputs.version }}
          release-tag: server-v${{ inputs.version }}
          # The MSI only: the MSIX is unsigned (for the Store), the ZIP is Scoop's.
          installers-regex: '-windows\.msi$'
          release-notes-url: https://github.com/xlollx/Trackhop/releases/tag/server-v${{ inputs.version }}
          token: ${{ secrets.WINGET_TOKEN }}

  chocolatey:
    # CHOCOLATEY_API_KEY: the API key of the xlollx account on community.chocolatey.org. Every
    # version waits for the community repository's moderation (automatic checks, then a person).
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.chocolatey }}
    runs-on: windows-latest
    env:
      CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
      VERSION: ${{ inputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: No CHOCOLATEY_API_KEY
        if: env.CHOCOLATEY_API_KEY == ''
        run: 'echo "::notice::Chocolatey skipped, no CHOCOLATEY_API_KEY secret yet (packaging/README.md)"'

      - name: Checkout
        if: env.CHOCOLATEY_API_KEY != ''
        uses: actions/checkout@v7

      - name: The release's MSI
        if: env.CHOCOLATEY_API_KEY != ''
        id: msi
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "server-v$env:VERSION" --pattern "Trackhop-Desktop-v$env:VERSION-windows.msi" --dir msi
          $hash = (Get-FileHash "msi/Trackhop-Desktop-v$env:VERSION-windows.msi" -Algorithm SHA256).Hash
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Pack
        if: env.CHOCOLATEY_API_KEY != ''
        run: |
          ./packaging/chocolatey/update.ps1 -Version $env:VERSION -Checksum "${{ steps.msi.outputs.sha256 }}"
          choco pack packaging/chocolatey/trackhop/trackhop.nuspec --outputdirectory choco-out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install and remove it here
        # The package as users get it: installs the MSI silently, then uninstalls it.
        if: env.CHOCOLATEY_API_KEY != ''
        run: |
          choco install trackhop --source "$PWD\choco-out" -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "$env:LOCALAPPDATA\Trackhop\Trackhop.exe")) { throw 'Trackhop.exe not installed' }
          choco uninstall trackhop -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Push
        if: env.CHOCOLATEY_API_KEY != ''
        run: |
          choco push "choco-out/trackhop.$env:VERSION.nupkg" --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Keep the package
        if: env.CHOCOLATEY_API_KEY != ''
        uses: actions/upload-artifact@v7
        with:
          name: chocolatey-trackhop-${{ inputs.version }}
          path: choco-out/*.nupkg
          retention-days: 30

  aur:
    # AUR_SSH_KEY: the private half of an SSH key whose public half is in the xlollx account on
    # aur.archlinux.org (packaging/README.md, AUR). packaging/aur/ with the new version and checksum,
    # built and installed here on Arch, then pushed to trackhop-bin (the first push creates it).
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.aur }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
      VERSION: ${{ inputs.version }}
      # The AUR's Ed25519 host key, as aur.archlinux.org's home page lists it.
      AUR_HOST_KEY: SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4
      GIT_SSH_COMMAND: ssh -i /root/.ssh/aur -o IdentitiesOnly=yes -o UserKnownHostsFile=/root/.ssh/known_hosts -o StrictHostKeyChecking=yes
    steps:
      - name: No AUR_SSH_KEY
        if: env.AUR_SSH_KEY == ''
        run: 'echo "::notice::AUR skipped, no AUR_SSH_KEY secret yet (packaging/README.md)"'

      - name: Tools
        if: env.AUR_SSH_KEY != ''
        run: pacman -Syu --noconfirm --needed git openssh pacman-contrib

      - name: Checkout
        if: env.AUR_SSH_KEY != ''
        uses: actions/checkout@v7

      - name: SSH
        # In /root/.ssh, not ~ ($HOME is /github/home in a container job, and ssh ignores $HOME).
        if: env.AUR_SSH_KEY != ''
        run: |
          install -d -m 700 /root/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > /root/.ssh/aur && chmod 600 /root/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org > /root/.ssh/known_hosts 2> /dev/null
          [ "$(ssh-keygen -lf /root/.ssh/known_hosts | awk '{print $2}')" = "$AUR_HOST_KEY" ] || { echo "::error::AUR host key does not match"; exit 1; }

      - name: Package, build and install
        if: env.AUR_SSH_KEY != ''
        run: |
          git clone ssh://aur@aur.archlinux.org/trackhop-bin.git aur
          cp packaging/aur/PKGBUILD packaging/aur/trackhop.desktop aur/
          sed -i -e "s/^pkgver=.*/pkgver=$VERSION/" -e "s/^pkgrel=.*/pkgrel=1/" aur/PKGBUILD
          useradd -m builder && chown -R builder aur
          # makepkg never runs as root; pacman -U then brings the dependencies.
          su builder -c 'cd aur && updpkgsums && makepkg --printsrcinfo > .SRCINFO && makepkg -f --nodeps'
          pacman -U --noconfirm aur/trackhop-bin-$VERSION-1-x86_64.pkg.tar.zst
          timeout 60 trackhop-cli --help > /dev/null

      - name: Push
        if: env.AUR_SSH_KEY != ''
        run: |
          cd aur
          git config --global --add safe.directory "$PWD"
          git add PKGBUILD .SRCINFO trackhop.desktop
          if git diff --cached --quiet; then echo "trackhop-bin $VERSION is on the AUR already."; exit 0; fi
          git -c user.name=xlollx -c user.email=72248161+xlollx@users.noreply.github.com commit -q -m "trackhop-bin $VERSION"
          git push origin HEAD:master
