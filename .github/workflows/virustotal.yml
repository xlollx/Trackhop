# VirusTotal checks of a release's files: every file looked up (or uploaded) and checked by the
# antivirus engines VirusTotal runs; the results go into the release notes (a section of their own,
# replaced on a new check) and, for the README's badge and the site's security page, into the
# "badges" branch (virustotal-<app|desktop>.json, a shields.io endpoint, and virustotal/<app|desktop>.json).
# Called by build.yml and desktop.yml after a new release (a release made with the workflow's own
# token starts no other workflow), or by hand for any tag. Skipped until the VT_API_KEY secret exists.
name: VirusTotal

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v1.5.2 or server-v0.6.1 (empty: the newest releases still shown as flagged)'
        type: string
        required: false
  # Every day: a file flagged when its release came out is checked again. The flags are nearly always one
  # engine's machine-learning guess (Microsoft's "…!ml"), and those are often withdrawn within a day.
  schedule:
    - cron: '23 7 * * *'

permissions:
  contents: write

# One at a time: the free API allows 4 requests a minute, and both write the badges branch.
concurrency:
  group: virustotal
  cancel-in-progress: false

jobs:
  # The tag asked for, or on the daily run the newest app and Desktop releases still shown as flagged.
  pick:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.pick.outputs.tags }}
    steps:
      - id: pick
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$TAG" ]; then
            echo "tags=$(jq -cn --arg t "$TAG" '[$t]')" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tags='[]'
          for p in app desktop; do
            j=$(gh api "repos/$GITHUB_REPOSITORY/contents/virustotal/$p.json?ref=badges" -H 'Accept: application/vnd.github.raw') || continue
            t=$(jq -r 'select(.clean == false) | .tag // empty' <<<"$j")
            if [ -n "$t" ]; then tags=$(jq -c --arg t "$t" '. + [$t]' <<<"$tags"); fi
          done
          echo "Flagged, checked again: $tags"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

  scan:
    needs: pick
    if: ${{ needs.pick.outputs.tags != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.pick.outputs.tags) }}
    env:
      TAG: ${{ matrix.tag }}
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: No VT_API_KEY
        if: ${{ env.VT_API_KEY == '' }}
        run: echo "::notice::No VT_API_KEY secret, so the release's files are not checked."

      - name: Checkout
        if: ${{ env.VT_API_KEY != '' }}
        uses: actions/checkout@v7

      - name: The release's files
        if: ${{ env.VT_API_KEY != '' }}
        run: gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D files

      - name: Check them
        id: scan
        if: ${{ env.VT_API_KEY != '' }}
        run: python3 scripts/virustotal.py scan --tag "$TAG" --out out files/*

      - name: Into the release notes
        if: ${{ env.VT_API_KEY != '' }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json body -q .body > body.md
          python3 scripts/virustotal.py notes body.md out/notes.md > notes.md
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file notes.md

      - name: Into the badges branch
        if: ${{ env.VT_API_KEY != '' }}
        env:
          PRODUCT: ${{ steps.scan.outputs.product }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin badges; then
            git worktree add badges FETCH_HEAD
            git -C badges checkout -B badges
          else
            git worktree add --detach badges
            git -C badges checkout --orphan badges
            git -C badges rm -rf --quiet .
            printf 'Data for the badges of the README and the site, written by .github/workflows/virustotal.yml.\n' > badges/README.md
          fi
          mkdir -p badges/virustotal
          # Only a newer version replaces the one shown (a check of an older tag by hand leaves it).
          shown=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['version'])" "badges/virustotal/$PRODUCT.json" 2>/dev/null || echo 0)
          new=$(python3 -c "import json; print(json.load(open('out/report.json'))['version'])")
          if [ "$(printf '%s\n%s\n' "$shown" "$new" | sort -V | tail -1)" != "$new" ]; then
            echo "The badge shows $shown, newer than $new: left as it is."; exit 0
          fi
          cp out/report.json "badges/virustotal/$PRODUCT.json"
          cp out/badge.json "badges/virustotal-$PRODUCT.json"
          git -C badges add -A
          git -C badges diff --cached --quiet && { echo "No change."; exit 0; }
          git -C badges commit -q -m "VirusTotal: $TAG"
          git -C badges push origin badges

      # The run fails only on a serious flag: two or more engines on one file, or a verdict that is not
      # one engine's machine-learning or generic guess ("…!ml", "Generic…"). A lone guess stays in the
      # release notes and the security page, as a warning here (the owner's choice, 11/11).
      # KNOWN: lone verdicts already reported to the vendor as false positives (engine, verdict, end of
      # the file name). They warn instead of failing while that one engine is the only one on the file.
      - name: Flagged
        if: ${{ steps.scan.outputs.flagged == 'true' }}
        run: |
          python3 - <<'PY'
          import json, sys
          r = json.load(open("out/report.json"))
          KNOWN = [
              # Reported to Panda on 18/11 (Desktop Linux archive, a playlist parser read as an exploit).
              ("Panda", "Exploit/WinampPLS", "-linux.tar.gz"),
              # The same verdict on the same code in the Windows archive and MSIX (server 2.1.3, 21/11):
              # added with the owner's OK, to be reported to Panda like the Linux one.
              ("Panda", "Exploit/WinampPLS", "-windows.zip"),
              ("Panda", "Exploit/WinampPLS", "-windows.msix"),
          ]
          serious, guesses = [], []
          for f in r["files"]:
              fb = f.get("flagged_by") or {}
              if not fb: continue
              guess = all(v.endswith("!ml") or "generic" in v.lower() for v in fb.values())
              known = len(fb) == 1 and any(e in fb and fb[e] == v and f["name"].endswith(t) for e, v, t in KNOWN)
              if known:
                  print(f"::warning::Known false positive, already reported: {f['name']}: {fb}")
                  continue
              (guesses if len(fb) == 1 and guess else serious).append(f"{f['name']}: {fb}")
          for g in guesses: print(f"::warning::One engine's guess (likely a false positive, report it): {g}")
          for s_ in serious: print(f"::error::Flagged: {s_}")
          sys.exit(1 if serious else 0)
          PY
