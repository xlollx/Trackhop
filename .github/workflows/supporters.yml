# The supporters thanked in the site's footer (docs/_data/supporters.yml), kept up to date:
# - Ko-fi: each public donation reaches the Cloudflare Worker in packaging/supporters, which sends
#   the name here (repository_dispatch "supporter"); private ones are never sent.
# - GitHub Sponsors: once a day, the public sponsors.
# New names go straight to main (the owner's choice): the site shows them a few minutes later.
# Names only, never amounts.
name: Supporters

on:
  repository_dispatch:
    types: [supporter]
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:
    inputs:
      name:
        description: A supporter's name to add by hand (empty = check GitHub Sponsors)
        required: false

permissions:
  contents: write
  pages: write

concurrency:
  group: supporters
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Ko-fi supporter, or one added by hand
        if: github.event_name == 'repository_dispatch' || inputs.name != ''
        env:
          NAME: ${{ github.event.client_payload.name || inputs.name }}
        run: python3 scripts/supporters.py "$NAME" | tee -a added.txt

      - name: GitHub Sponsors
        if: github.event_name != 'repository_dispatch' && inputs.name == ''
        continue-on-error: true
        run: |
          gh api graphql -f query='query { user(login: "${{ github.repository_owner }}") { sponsorshipsAsMaintainer(first: 100, activeOnly: false) { nodes { privacyLevel sponsorEntity { ... on User { login name } ... on Organization { login name } } } } } }' \
            | python3 scripts/supporters.py --sponsors - | tee -a added.txt

      - name: Publish
        run: |
          if git diff --quiet -- docs/_data/supporters.yml; then echo "Nobody new."; exit 0; fi
          names=$(paste -sd ',' added.txt | sed 's/,/, /g')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/_data/supporters.yml
          git commit -m "Site: thank $names"
          # Someone may have pushed meanwhile: replay on top and try again.
          for i in 1 2 3; do git pull --rebase -q origin main && git push origin HEAD:main && break; sleep 5; done
          # A push made with the workflow's token may not start the site's build on its own.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" > /dev/null || true
