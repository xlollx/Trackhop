why_title: Dlaczego nie internetowy serwis do przenoszenia?
why_intro: 'Soundiiz, TuneMyMusic i FreeYourMusic świetnie sprawdzają się przy jednorazowej przeprowadzce. Trackhop służy do utrzymywania playlist w zgodzie na dłuższą metę, bez oddawania komukolwiek swoich kont. Porównania: <a href="/guide/soundiiz-alternative">Trackhop i Soundiiz</a>, <a href="/guide/tunemymusic-alternative">Trackhop i TuneMyMusic</a>.'
