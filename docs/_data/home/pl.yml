docker_intro: '<strong>Docker</strong> <span class="stage">beta</span>, na domowy serwer, NAS lub Raspberry Pi:'
docker_password: wybierz-wlasne
docker_after: 'Następnie otwórz <code>http://127.0.0.1:8080</code>. Aby zaktualizować, pobierz obraz i uruchom kontener ponownie: synchronizacje zostają w woluminie. Ustawienia, Docker Compose i co tam działa: <a href="/guide/docker"><strong>przewodnik po Dockerze</strong></a>. Dostępny też na <a href="https://hub.docker.com/r/xlollx/trackhop">Docker Hub</a> jako <code>xlollx/trackhop</code>. Na <a href="/guide/playlist-sync-nas">NAS-ie (Synology, Unraid, TrueNAS)</a> albo <a href="/guide/self-hosted-playlist-sync">obok Navidrome, Jellyfin lub Plex</a>. Dla całego domu: <a href="/guide/docker#several-people-on-one-server">osobne konto dla każdego</a>, każdy się loguje i ma własne serwisy i synchronizacje.'
azure_before: '<strong>Na Azure</strong> <span class="stage">beta</span>, bez serwera w domu:'
azure_after: 'tworzy Trackhop w Twojej własnej subskrypcji Azure (Container Apps, HTTPS, dane w Azure Files). Rozliczane w Twojej subskrypcji: około 5 &#36; miesięcznie w większości regionów, gdy między synchronizacjami jest bezczynny, do około 15 &#36;, jeśli pracuje bez przerwy (szacunek na podstawie cennika Azure dla Container Apps po miesięcznym darmowym limicie; przechowywanie kosztuje grosze). <a href="/guide/docker#on-azure-beta">Więcej</a>.'
both_have: "Obie wersje mają wygląd aplikacji, sprawdzanie nieznalezionych utworów, playlisty plikowe w każdym formacie i Narzędzia z aplikacji: eksport, pełne kopie zapasowe (także według harmonogramu), duplikaty, nieodtwarzalne utwory, playlisty AI i Twoje statystyki."
data_title: Jak Trackhop korzysta z Twoich danych
data1: "Trackhop łączy się z wybranymi przez Ciebie serwisami muzycznymi (Spotify, YouTube Music, Apple Music, Amazon Music, TIDAL, Deezer, serwery prywatne) za pomocą logowania danego serwisu. Odczytuje Twoje playlisty i ich utwory, a gdy uruchomisz lub zaplanujesz synchronizację, tworzy playlisty oraz dodaje lub usuwa utwory na Twoim koncie. W przypadku YouTube Music przez API Google oznacza to YouTube Data API z uprawnieniem <code>youtube</code>, używanym wyłącznie do Twoich playlist i wyłącznie na Twoim urządzeniu."
data2: 'Tokeny dostępu są przechowywane w postaci zaszyfrowanej na telefonie i nigdy nie trafiają do twórcy Trackhop ani do żadnych podmiotów trzecich. Nie ma serwera Trackhop. Szczegóły w <a href="/privacy-policy">polityce prywatności</a>.'
start_title: Zacznij
start_intro: 'Android 8.0 lub nowszy, w językach: angielskim, włoskim, francuskim, niemieckim, hiszpańskim, portugalskim, polskim, rosyjskim, tureckim, chińskim, japońskim i koreańskim. Nie wiesz, którą wersję wybrać? <a href="/guide/versions">Który Trackhop?</a> je porównuje. <a href="/guide/">Przewodnik</a> prowadzi przez pierwszą synchronizację i najczęstsze błędy; jeśli coś nie działa tak, jak opisano, <em>Dziennik → Zgłoś na GitHub</em> otwiera zgłoszenie z już uzupełnionymi szczegółami.'
start_apk: lub APK z GitHub
step_by_step: 'Krok po kroku: <a href="/guide/spotify-to-youtube-music">ze Spotify do YouTube Music</a> · <a href="/guide/apple-music-to-spotify">z Apple Music do Spotify</a> · <a href="/guide/spotify-to-tidal">ze Spotify do TIDAL</a> · <a href="/guide/spotify-to-apple-music">ze Spotify do Apple Music</a> · <a href="/guide/youtube-music-to-spotify">z YouTube Music do Spotify</a> · <a href="/guide/deezer-to-spotify">z Deezer do Spotify</a> · <a href="/guide/amazon-music-to-spotify">z Amazon Music do Spotify</a> · <a href="/guide/spotify-to-navidrome-jellyfin">ze Spotify do Navidrome, Jellyfin lub Plex</a> · <a href="/guide/export-playlist-csv">playlista do CSV lub M3U</a> · <a href="/guide/shazam">Twoje Shazamy w playliście</a>. Przewodnik po polsku: <a href="/guide/przenoszenie-playlist">Przenoszenie playlist między Spotify, YouTube Music, Apple Music i Deezer za darmo</a>.'
no_phone: 'Nie masz pod ręką telefonu z Androidem? <a href="#docker">Wypróbuj Trackhop Desktop</a> na Windows lub Linuksie albo wersję Docker.'
play_bridge: 'Korzystasz z wersji z Google Play lub AppGallery? <a href="https://github.com/xlollx/Trackhop-Bridge/releases/latest"><strong>Pobierz Trackhop Bridge</strong></a>, wtyczkę, która dodaje YouTube Music, Amazon Music oraz Spotify i Apple Music bez kluczy deweloperskich (nieoficjalne interfejsy webowe: najpierw przeczytaj jej uwagi).'
thanks_title: Dziękujemy
thanks_how: 'osobom, dzięki którym Trackhop pozostaje darmowy. Chcesz zobaczyć tu swoje imię? <a href="https://ko-fi.com/xlollx" target="_blank" rel="noopener">Ko-fi</a> (karta lub PayPal) lub <a href="https://github.com/sponsors/xlollx" target="_blank" rel="noopener">GitHub Sponsors</a>.'
renamed: '<strong>Songport to teraz Trackhop.</strong> Ta sama aplikacja, ten sam kod, te same aktualizacje: zmieniła się tylko nazwa, bo niezwiązany z nami serwis o nazwie „SongPort” działa w tej samej dziedzinie. Zainstalowana aplikacja aktualizuje się normalnie i zachowuje wszystkie dane, a stare linki nadal działają.'
