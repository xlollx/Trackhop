also_title: Także na komputerze lub NAS-ie
also_intro: "Chcesz wypróbować bez telefonu albo trzymać synchronizacje na stale włączonej maszynie? Ten sam silnik działa na komputerze i na serwerze, ze stroną WWW do łączenia serwisów i tworzenia synchronizacji. Obie wersje to <strong>beta</strong>: nadają się do codziennego użytku, ale są jeszcze młode, więc zachowaj kopię swojej konfiguracji i daj znać, co się psuje."
desktop_intro: '<strong>Trackhop Desktop</strong> dla Windows, macOS i Linuksa: instaluje się jak każdy program, bez Dockera i Javy, bez uprawnień administratora. Siedzi obok zegara i uruchamia zaplanowane synchronizacje, gdy komputer jest włączony. Wersja %V% (<a href="https://github.com/xlollx/Trackhop/releases/tag/server-v%V%">co nowego</a>).'
