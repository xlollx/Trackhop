title: Trackhop
description: Utrzymuj identyczne playlisty w Spotify, Apple Music, YouTube Music, Amazon Music, TIDAL, Deezer i na własnym serwerze muzycznym. Na telefonie, bez konta, bez serwera.
h1: "Twoje playlisty,<br>wszędzie."
lead: Trackhop synchronizuje playlisty między serwisami muzycznymi, ręcznie lub według harmonogramu.
sub: "Darmowy i open source. Bez konta, bez serwera, bez subskrypcji: wszystko działa na Twoim telefonie."
