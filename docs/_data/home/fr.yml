why_title: Pourquoi pas un service de transfert en ligne ?
why_intro: 'Soundiiz, TuneMyMusic et FreeYourMusic sont parfaits pour un transfert ponctuel. Trackhop sert à garder vos playlists à jour dans la durée, sans confier vos comptes à qui que ce soit. Comparaisons : <a href="/guide/soundiiz-alternative">Trackhop et Soundiiz</a>, <a href="/guide/tunemymusic-alternative">Trackhop et TuneMyMusic</a>.'
