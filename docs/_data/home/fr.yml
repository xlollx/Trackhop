also_title: Aussi sur un ordinateur ou un NAS
also_intro: "Envie d’essayer sans téléphone, ou de faire tourner vos syncs sur une machine toujours allumée ? Le même moteur fonctionne sur votre ordinateur et sur un serveur, avec une page web pour connecter les services et créer des syncs. Les deux sont en <strong>bêta</strong> : ils conviennent à un usage quotidien mais sont encore jeunes, alors gardez une copie de votre configuration et dites-nous ce qui ne marche pas."
desktop_intro: '<strong>Trackhop Desktop</strong> pour Windows, macOS et Linux : il s’installe comme n’importe quel programme, sans Docker ni Java, sans droits d’administrateur. Il se place à côté de l’horloge et lance les syncs planifiées tant que l’ordinateur est allumé. Version %V% (<a href="https://github.com/xlollx/Trackhop/releases/tag/server-v%V%">nouveautés</a>).'
