docker_intro: '<strong>Docker</strong> <span class="stage">bêta</span>, pour un serveur maison, un NAS ou un Raspberry Pi :'
docker_password: choisissez-en-un
docker_after: 'Ouvrez ensuite <code>http://127.0.0.1:8080</code>. Pour mettre à jour, récupérez la nouvelle image et relancez le conteneur : vos syncs restent dans le volume. Réglages, Docker Compose et ce qui fonctionne : <a href="/guide/docker"><strong>le guide Docker</strong></a>. Aussi sur <a href="https://hub.docker.com/r/xlollx/trackhop">Docker Hub</a> sous le nom <code>xlollx/trackhop</code>. Sur un <a href="/guide/playlist-sync-nas">NAS (Synology, Unraid, TrueNAS)</a>, ou <a href="/guide/self-hosted-playlist-sync">à côté de Navidrome, Jellyfin ou Plex</a>. Pour toute la maison, <a href="/guide/docker#several-people-on-one-server">un compte par personne</a> : chacun se connecte et a ses propres services et syncs.'
azure_before: '<strong>Sur Azure</strong> <span class="stage">bêta</span>, sans serveur à la maison :'
azure_after: 'crée Trackhop dans votre propre abonnement Azure (Container Apps, HTTPS, données sur Azure Files). Facturé sur votre abonnement : environ 5 &#36; par mois dans la plupart des régions s’il reste inactif entre les syncs, jusqu’à environ 15 &#36; s’il est occupé en permanence (estimation d’après les tarifs publics d’Azure pour Container Apps, après la franchise gratuite mensuelle ; le stockage coûte quelques centimes). <a href="/guide/docker#on-azure-beta">En savoir plus</a>.'
both_have: "Les deux ont le look de l’app, la vérification des titres introuvables, les playlists de fichiers dans tous les formats et les Outils de l’app : export, sauvegardes complètes (aussi planifiées), doublons, titres injouables, playlists par IA et vos statistiques."
data_title: Comment Trackhop utilise vos données
data1: "Trackhop se connecte aux services de musique que vous choisissez (Spotify, YouTube Music, Apple Music, Amazon Music, TIDAL, Deezer, serveurs personnels) avec la connexion propre à chaque service. Il lit vos playlists et leurs titres et, quand vous lancez ou planifiez une sync, crée des playlists et ajoute ou retire des titres dans votre propre compte. Pour YouTube Music via l’API de Google, cela signifie la YouTube Data API avec l’autorisation <code>youtube</code>, utilisée uniquement pour vos playlists et uniquement sur votre appareil."
data2: 'Les jetons d’accès sont stockés chiffrés sur le téléphone et ne sont jamais envoyés au développeur de Trackhop ni à aucun tiers. Il n’y a pas de serveur Trackhop. Détails dans la <a href="/privacy-policy">politique de confidentialité</a>.'
start_title: Commencer
start_intro: 'Android 8.0 ou plus récent, en anglais, italien, français, allemand, espagnol, portugais, polonais, russe, turc, chinois, japonais et coréen. Vous hésitez entre les versions ? <a href="/guide/versions">Quel Trackhop ?</a> les compare. Le <a href="/guide/">guide</a> accompagne la première sync et les erreurs courantes ; si quelque chose ne fonctionne pas comme décrit, <em>Journal → Signaler sur GitHub</em> ouvre un rapport avec les détails déjà remplis.'
start_apk: ou l’APK depuis GitHub
step_by_step: 'Pas à pas : <a href="/guide/spotify-to-youtube-music">de Spotify vers YouTube Music</a> · <a href="/guide/apple-music-to-spotify">d’Apple Music vers Spotify</a> · <a href="/guide/spotify-to-tidal">de Spotify vers TIDAL</a> · <a href="/guide/spotify-to-apple-music">de Spotify vers Apple Music</a> · <a href="/guide/youtube-music-to-spotify">de YouTube Music vers Spotify</a> · <a href="/guide/deezer-to-spotify">de Deezer vers Spotify</a> · <a href="/guide/amazon-music-to-spotify">d’Amazon Music vers Spotify</a> · <a href="/guide/spotify-to-navidrome-jellyfin">de Spotify vers Navidrome, Jellyfin ou Plex</a> · <a href="/guide/export-playlist-csv">une playlist en CSV ou M3U</a> · <a href="/guide/shazam">vos Shazams dans une playlist</a>. Guide en français : <a href="/guide/transferer-playlists">Transférer des playlists entre Spotify, YouTube Music, Apple Music et Deezer, gratuitement</a>.'
no_phone: 'Pas de téléphone Android sous la main ? <a href="#docker">Essayez Trackhop Desktop</a> sur Windows ou Linux, ou la version Docker.'
play_bridge: 'Vous utilisez la version Google Play ou AppGallery ? <a href="https://github.com/xlollx/Trackhop-Bridge/releases/latest"><strong>Téléchargez Trackhop Bridge</strong></a>, le plugin qui ajoute YouTube Music, Amazon Music, ainsi que Spotify et Apple Music sans clés de développeur (interfaces web non officielles : lisez d’abord ses notes).'
thanks_title: Merci
thanks_how: 'aux personnes qui permettent à Trackhop de rester gratuit. Vous voulez voir votre nom ici ? <a href="https://ko-fi.com/xlollx" target="_blank" rel="noopener">Ko-fi</a> (carte ou PayPal) ou <a href="https://github.com/sponsors/xlollx" target="_blank" rel="noopener">GitHub Sponsors</a>.'
renamed: '<strong>Songport s’appelle désormais Trackhop.</strong> Même app, même code, mêmes mises à jour : seul le nom a changé, car un service sans rapport appelé « SongPort » opère dans le même domaine. L’app installée se met à jour normalement et garde toutes ses données, et les anciens liens continuent de fonctionner.'
