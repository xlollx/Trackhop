title: Trackhop
description: Spotify、Apple Music、YouTube Music、Amazon Music、TIDAL、Deezer、そして自分の音楽サーバーで、プレイリストをいつも同じ内容に。スマホだけで完結、アカウントもサーバーも不要。
h1: "あなたのプレイリストを、<br>どこでも。"
lead: Trackhop は音楽サービス間でプレイリストを同期します。手動でも、スケジュールでも。
sub: "無料のオープンソース。アカウントもサーバーもサブスクリプションも不要：すべてスマホの中で動きます。"
