docker_intro: '<strong>Docker</strong> <span class="stage">ベータ</span>：自宅サーバー、NAS、Raspberry Pi に：'
docker_password: kimete-kudasai
docker_after: 'あとは <code>http://127.0.0.1:8080</code> を開くだけ。アップデートはイメージを pull してコンテナを起動し直せば OK：同期の設定はボリュームに残ります。設定、Docker Compose、動作する機能について：<a href="/guide/docker"><strong>Docker ガイド</strong></a>。<a href="https://hub.docker.com/r/xlollx/trackhop">Docker Hub</a> にも <code>xlollx/trackhop</code> として公開しています。<a href="/guide/playlist-sync-nas">NAS（Synology、Unraid、TrueNAS）</a>でも、<a href="/guide/self-hosted-playlist-sync">Navidrome、Jellyfin、Plex と並べて</a>も使えます。家族みんなで使うなら<a href="/guide/docker#several-people-on-one-server">一人ずつアカウント</a>を：それぞれがログインし、自分のサービスと同期を持てます。'
azure_before: '<strong>Azure で</strong> <span class="stage">ベータ</span>、自宅にサーバーがなくても：'
azure_after: 'あなた自身の Azure サブスクリプションに Trackhop を作成します（Container Apps、HTTPS、データは Azure Files に保存）。料金はあなたのサブスクリプションに請求されます：同期の合間に待機しているだけなら、ほとんどのリージョンで月額約 &#36;5、常にフル稼働なら最大で約 &#36;15（Container Apps の月間無料枠を差し引いた Azure の定価からの概算。ストレージ代は数セント程度）。<a href="/guide/docker#on-azure-beta">詳しく</a>。'
both_have: "どちらもアプリと同じ見た目で、見つからない曲の確認、あらゆる形式のファイルプレイリスト、そしてアプリのツール（エクスポート、完全バックアップ（スケジュールも可）、重複、再生できない曲、AI プレイリスト、統計）が使えます。"
data_title: Trackhop のデータの扱い
data1: "Trackhop は、あなたが選んだ音楽サービス（Spotify、YouTube Music、Apple Music、Amazon Music、TIDAL、Deezer、個人サーバー）に、各サービス自身のログインで接続します。プレイリストとその曲を読み取り、同期を開始またはスケジュールしたときには、あなた自身のアカウントでプレイリストを作成し、曲を追加・削除します。Google の API 経由の YouTube Music では、YouTube Data API の <code>youtube</code> 権限を使いますが、用途はあなたのプレイリストのみ、処理はあなたの端末上だけです。"
data2: 'アクセストークンはスマホ上で暗号化して保存され、Trackhop の開発者にも第三者にも送信されません。Trackhop のサーバーは存在しません。詳しくは<a href="/privacy-policy">プライバシーポリシー</a>をご覧ください。'
start_title: はじめよう
start_intro: 'Android 8.0 以降。対応言語は英語、イタリア語、フランス語、ドイツ語、スペイン語、ポルトガル語、ポーランド語、ロシア語、トルコ語、中国語、日本語、韓国語。どのビルドにするか迷ったら、<a href="/guide/versions">どの Trackhop？</a>で比較できます。<a href="/guide/">ガイド</a>では最初の同期とよくあるエラーを解説しています。説明どおりに動かないときは、<em>ログ → GitHub で報告</em> から詳細入りのレポートを作成できます。'
start_apk: または GitHub から APK
step_by_step: 'ステップごとに解説：<a href="/guide/spotify-to-youtube-music">Spotify から YouTube Music へ</a> · <a href="/guide/apple-music-to-spotify">Apple Music から Spotify へ</a> · <a href="/guide/spotify-to-tidal">Spotify から TIDAL へ</a> · <a href="/guide/spotify-to-apple-music">Spotify から Apple Music へ</a> · <a href="/guide/youtube-music-to-spotify">YouTube Music から Spotify へ</a> · <a href="/guide/deezer-to-spotify">Deezer から Spotify へ</a> · <a href="/guide/amazon-music-to-spotify">Amazon Music から Spotify へ</a> · <a href="/guide/spotify-to-navidrome-jellyfin">Spotify から Navidrome、Jellyfin、Plex へ</a> · <a href="/guide/export-playlist-csv">プレイリストを CSV や M3U に</a> · <a href="/guide/shazam">Shazam の履歴をプレイリストに</a>。日本語ガイド：<a href="/guide/playlist-transfer-ja">プレイリストを無料で移行</a>。'
no_phone: 'Android スマホが手元にない？ Windows や Linux で <a href="#docker">Trackhop Desktop を試す</a>か、Docker 版をどうぞ。'
play_bridge: 'Google Play・AppGallery 版をお使いですか？ <a href="https://github.com/xlollx/Trackhop-Bridge/releases/latest"><strong>Trackhop Bridge をダウンロード</strong></a>：YouTube Music、Amazon Music、そして開発者キーなしの Spotify と Apple Music を追加するプラグインです（非公式の Web インターフェースを使うので、先に注意事項をお読みください）。'
thanks_title: ありがとう
thanks_how: 'Trackhop を無料で支えてくれている皆さんへ。ここに名前を載せたい方は <a href="https://ko-fi.com/xlollx" target="_blank" rel="noopener">Ko-fi</a> または <a href="https://github.com/sponsors/xlollx" target="_blank" rel="noopener">GitHub Sponsors</a> から。'
renamed: '<strong>Songport は Trackhop になりました。</strong>アプリもコードもアップデートも同じで、変わったのは名前だけです。同じ分野で「SongPort」という無関係のサービスがあるためです。インストール済みのアプリは通常どおりアップデートされ、データもすべてそのまま。古いリンクも引き続き使えます。'
