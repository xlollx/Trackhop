also_title: パソコンや NAS でも
also_intro: "スマホなしで試したい、あるいは常時起動のマシンで同期を回し続けたい？ 同じエンジンがパソコンでもサーバーでも動き、Web ページからサービスの接続や同期の作成ができます。どちらも<strong>ベータ</strong>です：普段使いには十分ですがまだ新しいので、設定のコピーを取っておき、不具合があれば教えてください。"
desktop_intro: 'Windows・macOS・Linux 用の <strong>Trackhop Desktop</strong>：普通のアプリと同じようにインストールでき、Docker も Java も管理者権限も不要。時計の横に常駐し、パソコンが起動している間スケジュール同期を実行します。バージョン %V%（<a href="https://github.com/xlollx/Trackhop/releases/tag/server-v%V%">変更内容</a>）。'
