why_title: ¿Por qué no un servicio de transferencia online?
why_intro: 'Soundiiz, TuneMyMusic y FreeYourMusic van bien para una mudanza puntual. Trackhop sirve para mantener las playlists al día con el tiempo, sin ceder tus cuentas a nadie. Comparados: <a href="/guide/soundiiz-alternative">Trackhop y Soundiiz</a>, <a href="/guide/tunemymusic-alternative">Trackhop y TuneMyMusic</a>.'
