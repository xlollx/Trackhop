also_title: También en un ordenador o un NAS
also_intro: "¿Quieres probarlo sin móvil o mantener las sincronizaciones en una máquina siempre encendida? El mismo motor funciona en tu ordenador y en un servidor, con una página web para conectar servicios y crear sincronizaciones. Ambos están en <strong>beta</strong>: sirven para el día a día pero aún son jóvenes, así que guarda una copia de tu configuración y cuéntanos qué falla."
desktop_intro: '<strong>Trackhop Desktop</strong> para Windows, macOS y Linux: se instala como cualquier programa, sin Docker ni Java, sin permisos de administrador. Se queda junto al reloj y ejecuta las sincronizaciones programadas mientras el ordenador está encendido. Versión %V% (<a href="https://github.com/xlollx/Trackhop/releases/tag/server-v%V%">novedades</a>).'
