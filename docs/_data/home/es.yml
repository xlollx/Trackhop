docker_intro: '<strong>Docker</strong> <span class="stage">beta</span>, para un servidor doméstico, un NAS o una Raspberry Pi:'
docker_password: elige-una
docker_after: 'Luego abre <code>http://127.0.0.1:8080</code>. Para actualizar, descarga la imagen y vuelve a iniciar el contenedor: tus sincronizaciones se quedan en el volumen. Ajustes, Docker Compose y qué funciona ahí: <a href="/guide/docker"><strong>la guía de Docker</strong></a>. También en <a href="https://hub.docker.com/r/xlollx/trackhop">Docker Hub</a> como <code>xlollx/trackhop</code>. En un <a href="/guide/playlist-sync-nas">NAS (Synology, Unraid, TrueNAS)</a>, o <a href="/guide/self-hosted-playlist-sync">junto a Navidrome, Jellyfin o Plex</a>. Para toda la casa, <a href="/guide/docker#several-people-on-one-server">una cuenta por persona</a>: cada uno inicia sesión y tiene sus propios servicios y sincronizaciones.'
azure_before: '<strong>En Azure</strong> <span class="stage">beta</span>, sin servidor en casa:'
azure_after: 'crea Trackhop en tu propia suscripción de Azure (Container Apps, HTTPS, datos en Azure Files). Se factura a tu suscripción: unos &#36;5 al mes en la mayoría de las regiones si está inactivo entre sincronizaciones, hasta unos &#36;15 si está ocupado todo el tiempo (estimación según los precios de lista de Azure para Container Apps tras su cuota gratuita mensual; el almacenamiento cuesta céntimos). <a href="/guide/docker#on-azure-beta">Más</a>.'
both_have: "Ambos tienen el aspecto de la app, la revisión de canciones no encontradas, las playlists de archivo en todos los formatos y las Herramientas de la app: exportación, copias de seguridad completas (también programadas), duplicados, canciones no reproducibles, playlists con IA y Tus números."
data_title: Cómo usa Trackhop tus datos
data1: "Trackhop se conecta a los servicios de música que elijas (Spotify, YouTube Music, Apple Music, Amazon Music, TIDAL, Deezer, servidores personales) con el inicio de sesión de cada servicio. Lee tus playlists y sus canciones y, cuando inicias o programas una sincronización, crea playlists y añade o quita canciones en tu propia cuenta. Para YouTube Music a través de la API de Google, esto significa la YouTube Data API con el permiso <code>youtube</code>, usado solo para tus playlists y solo en tu dispositivo."
data2: 'Los tokens de acceso se guardan cifrados en el móvil y nunca se envían al desarrollador de Trackhop ni a terceros. No existe ningún servidor de Trackhop. Detalles en la <a href="/privacy-policy">política de privacidad</a>.'
start_title: Empieza
start_intro: 'Android 8.0 o superior, en inglés, italiano, francés, alemán, español, portugués, polaco, ruso, turco, chino, japonés y coreano. ¿No sabes qué versión elegir? <a href="/guide/versions">¿Qué Trackhop?</a> las compara. La <a href="/guide/">guía</a> te acompaña en la primera sincronización y en los errores más comunes; si algo no funciona como se describe, <em>Registro → Informar en GitHub</em> abre un reporte con los detalles ya rellenados.'
start_apk: o el APK desde GitHub
step_by_step: 'Paso a paso: <a href="/guide/spotify-to-youtube-music">de Spotify a YouTube Music</a> · <a href="/guide/apple-music-to-spotify">de Apple Music a Spotify</a> · <a href="/guide/spotify-to-tidal">de Spotify a TIDAL</a> · <a href="/guide/spotify-to-apple-music">de Spotify a Apple Music</a> · <a href="/guide/youtube-music-to-spotify">de YouTube Music a Spotify</a> · <a href="/guide/deezer-to-spotify">de Deezer a Spotify</a> · <a href="/guide/amazon-music-to-spotify">de Amazon Music a Spotify</a> · <a href="/guide/spotify-to-navidrome-jellyfin">de Spotify a Navidrome, Jellyfin o Plex</a> · <a href="/guide/export-playlist-csv">una playlist a CSV o M3U</a> · <a href="/guide/shazam">tus Shazams en una playlist</a>. Guías en español: <a href="/guide/primeros-pasos">Primeros pasos con Trackhop</a> · <a href="/guide/transferir-playlists">Transferir playlists entre Spotify, YouTube Music, Apple Music y Deezer</a>.'
no_phone: '¿No tienes un móvil Android a mano? <a href="#docker">Prueba Trackhop Desktop</a> en Windows o Linux, o la versión Docker.'
play_bridge: '¿Usas la versión de Google Play o AppGallery? <a href="https://github.com/xlollx/Trackhop-Bridge/releases/latest"><strong>Descarga Trackhop Bridge</strong></a>, el plugin que añade YouTube Music, Amazon Music, y Spotify y Apple Music sin claves de desarrollador (interfaces web no oficiales: lee antes sus notas).'
thanks_title: Gracias
thanks_how: 'a quienes mantienen Trackhop gratis. ¿Quieres ver tu nombre aquí? <a href="https://ko-fi.com/xlollx" target="_blank" rel="noopener">Ko-fi</a> o <a href="https://github.com/sponsors/xlollx" target="_blank" rel="noopener">GitHub Sponsors</a>.'
renamed: '<strong>Songport ahora es Trackhop.</strong> La misma app, el mismo código, las mismas actualizaciones: solo ha cambiado el nombre, porque un servicio sin relación llamado "SongPort" opera en el mismo ámbito. Tu app instalada se actualiza con normalidad y conserva todos sus datos, y los enlaces antiguos siguen funcionando.'
