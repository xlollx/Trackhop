demo_alt: "Un recorrido por Trackhop: sincros, una nueva sincro, cuentas, herramientas, una canción compartida, las tarjetas de compatibilidad y póster, canciones no reproducibles, ajustes"
what_title: Qué hace
what_intro: Elige un origen y un destino, y cada cuánto sincronizar. Trackhop encuentra cada canción en el otro lado, te muestra qué va a cambiar y mantiene ambas al día.
card1_title: De cualquier servicio a cualquier servicio
card1: Playlists, canciones que te gustan, álbumes guardados y artistas seguidos. O pega el enlace de cualquier playlist pública.
card2_title: De forma programada
card2: Cada hora, cada 6 horas, a diario o semanalmente. Solo añadidos, o también las eliminaciones, y conservando el orden del origen.
card3_title: Nada al azar
card3: "Una vista previa antes de cada sincronización. Las canciones no encontradas pasan a revisión: elige la correcta una vez y Trackhop la recuerda."
card4_title: Tus cuentas siguen siendo tuyas
card4: Inicias sesión en la página de cada servicio. Los tokens de acceso se cifran en el móvil y nunca salen de él.
card5_title: Tu propio servidor de música
card5: "Navidrome y otros servidores Subsonic, Jellyfin y Plex, junto a los servicios de streaming. También archivos: CSV, M3U, XML, JSON."
card6_title: Herramientas para playlists
card6: Copias de seguridad, eliminación de duplicados, unir, dividir y ordenar, y un generador de playlists con tu propia clave de IA.
one_title: "Aunque uses un solo servicio"
one_intro: "No hace falta un segundo servicio. Si solo usas Spotify, Apple Music, YouTube Music u otro, Trackhop también cuida de tus playlists."
one1_title: "Guarda Discover Weekly"
one1: "Discover Weekly, Release Radar o tu daylist copiadas cada semana en una playlist tuya, antes de que cambien."
one1_href: "/guide/save-discover-weekly"
one2_title: "Copias de seguridad automáticas"
one2: "Cada playlist y tus canciones favoritas guardadas como archivos con fecha, a diario o cada semana, en la carpeta que elijas."
one2_href: "/guide/backup-spotify-playlists"
one3_title: "Elimina duplicados"
one3: "Las canciones que aparecen dos veces, incluso de otro álbum, encontradas y eliminadas de una vez. Se queda la primera copia."
one3_href: "/guide/remove-duplicates-spotify"
one4_title: "Arregla las canciones en gris"
one4: "Las canciones que ya no se pueden reproducir, cambiadas por una versión que sí funciona, en el mismo sitio. Con Deshacer."
one4_href: "/guide/fix-greyed-out-songs"
one5_title: "Tu Wrapped, cuando quieras"
one5: "Artistas principales, décadas y tu edad musical en una tarjeta para tus historias, cuando quieras, con historial."
one5_href: "/guide/wrapped-anytime"
one6_title: "Shazam, radio, listas de éxitos"
one6: "Tus Shazams, lo que suena en una radio, la canción de un TikTok o el Top 100 de un país, directo a una playlist."
one6_href: "/guide/shazam"
one_more: "Cómo funciona"
shots_alt: Sincronizaciones con sus cifras, una nueva sincronización, una canción compartida que entra en una playlist, lo compatibles que son dos playlists, un póster de playlist, canciones no reproducibles y sus sustitutas
