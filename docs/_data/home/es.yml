title: Trackhop
description: Mantén tus playlists idénticas en Spotify, Apple Music, YouTube Music, Amazon Music, TIDAL, Deezer y tu propio servidor de música. En tu móvil, sin cuenta y sin servidor.
h1: "Tus playlists,<br>en todas partes."
lead: Trackhop mantiene las playlists sincronizadas entre servicios de música, a mano o de forma programada.
sub: "Gratis y de código abierto. Sin cuenta, sin servidor, sin suscripción: todo funciona en tu móvil."
