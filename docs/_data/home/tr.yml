also_title: Bilgisayarda veya NAS'ta da
also_intro: "Telefonsuz denemek ya da senkronizasyonları hep açık duran bir makinede çalıştırmak mı istiyorsun? Aynı motor bilgisayarında ve bir sunucuda da çalışır; servisleri bağlamak ve senkronizasyon oluşturmak için bir web sayfasıyla. İkisi de <strong>beta</strong>: günlük kullanım için uygundur ama henüz yenidir, bu yüzden kurulumunun bir kopyasını sakla ve neyin bozulduğunu bize bildir."
desktop_intro: '<strong>Trackhop Desktop</strong> Windows, macOS ve Linux için: her program gibi kurulur, Docker ya da Java gerekmez, yönetici yetkisi gerekmez. Saatin yanında durur ve bilgisayar açıkken zamanlanmış senkronizasyonları çalıştırır. Sürüm %V% (<a href="https://github.com/xlollx/Trackhop/releases/tag/server-v%V%">neler yeni</a>).'
