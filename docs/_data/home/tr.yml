docker_intro: '<strong>Docker</strong> <span class="stage">beta</span>, ev sunucusu, NAS veya Raspberry Pi için:'
docker_password: bir-sifre-sec
docker_after: 'Ardından <code>http://127.0.0.1:8080</code> adresini aç. Güncellemek için imajı çek ve konteyneri yeniden başlat: senkronizasyonların birimde kalır. Ayarlar, Docker Compose ve orada neyin çalıştığı: <a href="/guide/docker"><strong>Docker rehberi</strong></a>. Ayrıca <a href="https://hub.docker.com/r/xlollx/trackhop">Docker Hub</a>''da <code>xlollx/trackhop</code> adıyla. Bir <a href="/guide/playlist-sync-nas">NAS (Synology, Unraid, TrueNAS)</a> üzerinde ya da <a href="/guide/self-hosted-playlist-sync">Navidrome, Jellyfin veya Plex''in yanında</a>. Tüm ev halkı için <a href="/guide/docker#several-people-on-one-server">herkese ayrı hesap</a>: herkes giriş yapar ve kendi servislerine ve senkronizasyonlarına sahip olur.'
azure_before: '<strong>Azure''da</strong> <span class="stage">beta</span>, evde sunucu olmadan:'
azure_after: 'Trackhop''u kendi Azure aboneliğinde oluşturur (Container Apps, HTTPS, veriler Azure Files''ta). Faturası aboneliğine yansır: senkronizasyonlar arasında boşta beklediğinde çoğu bölgede ayda yaklaşık 5 &#36;, sürekli meşgulse yaklaşık 15 &#36;''a kadar (Azure''un Container Apps liste fiyatlarından, aylık ücretsiz kotadan sonraki tahmin; depolama birkaç sent tutar). <a href="/guide/docker#on-azure-beta">Daha fazlası</a>.'
both_have: "İkisinde de uygulamanın görünümü, bulunamayan parçaların incelenmesi, her biçimde dosya çalma listeleri ve uygulamanın Araçları var: dışa aktarma, tam yedekler (zamanlanmış olarak da), kopyalar, çalınamayan parçalar, yapay zekâ çalma listeleri ve istatistiklerin."
data_title: Trackhop verilerini nasıl kullanır
data1: "Trackhop seçtiğin müzik servislerine (Spotify, YouTube Music, Apple Music, Amazon Music, TIDAL, Deezer, kişisel sunucular) her servisin kendi girişiyle bağlanır. Çalma listelerini ve parçalarını okur; bir senkronizasyonu başlattığında ya da zamanladığında kendi hesabında çalma listeleri oluşturur ve parça ekler veya kaldırır. Google'ın API'si üzerinden YouTube Music için bu, <code>youtube</code> izniyle YouTube Data API anlamına gelir; yalnızca senin çalma listelerin için ve yalnızca senin cihazında kullanılır."
data2: 'Erişim jetonları telefonda şifreli olarak saklanır ve asla Trackhop''un geliştiricisine ya da üçüncü taraflara gönderilmez. Trackhop sunucusu yoktur. Ayrıntılar <a href="/privacy-policy">gizlilik politikasında</a>.'
start_title: Başla
start_intro: 'Android 8.0 veya üstü; İngilizce, İtalyanca, Fransızca, Almanca, İspanyolca, Portekizce, Lehçe, Rusça, Türkçe, Çince, Japonca ve Korece. Hangi sürümü alacağından emin değil misin? <a href="/guide/versions">Hangi Trackhop?</a> sayfası bunları karşılaştırır. <a href="/guide/">Rehber</a> ilk senkronizasyonu ve yaygın hataları adım adım anlatır; bir şey anlatıldığı gibi çalışmazsa <em>Günlük → GitHub''da bildir</em> ayrıntıları önceden doldurulmuş bir rapor açar.'
start_apk: veya GitHub'dan APK
step_by_step: 'Adım adım: <a href="/guide/spotify-to-youtube-music">Spotify''dan YouTube Music''e</a> · <a href="/guide/apple-music-to-spotify">Apple Music''ten Spotify''a</a> · <a href="/guide/spotify-to-tidal">Spotify''dan TIDAL''a</a> · <a href="/guide/spotify-to-apple-music">Spotify''dan Apple Music''e</a> · <a href="/guide/youtube-music-to-spotify">YouTube Music''ten Spotify''a</a> · <a href="/guide/deezer-to-spotify">Deezer''dan Spotify''a</a> · <a href="/guide/amazon-music-to-spotify">Amazon Music''ten Spotify''a</a> · <a href="/guide/spotify-to-navidrome-jellyfin">Spotify''dan Navidrome, Jellyfin veya Plex''e</a> · <a href="/guide/export-playlist-csv">bir çalma listesini CSV veya M3U''ya</a> · <a href="/guide/shazam">Shazam''larını bir çalma listesine</a>. Türkçe rehber: <a href="/guide/calma-listesi-aktarma">Spotify, YouTube Music, Apple Music ve Deezer arasında çalma listesi aktarma, ücretsiz</a>.'
no_phone: 'Yanında Android telefon yok mu? Windows veya Linux''ta <a href="#docker">Trackhop Desktop''u dene</a> ya da Docker sürümünü.'
play_bridge: 'Google Play sürümünü mü kullanıyorsun? <a href="https://github.com/xlollx/Trackhop-Bridge/releases/latest"><strong>Trackhop Bridge''i indir</strong></a>: YouTube Music, Amazon Music ve geliştirici anahtarı olmadan Spotify ile Apple Music ekleyen eklenti (resmî olmayan web arayüzleri: önce notlarını oku).'
thanks_title: Teşekkürler
thanks_how: 'Trackhop''un ücretsiz kalmasını sağlayan herkese. Adının burada olmasını ister misin? <a href="https://ko-fi.com/xlollx" target="_blank" rel="noopener">Ko-fi</a> veya <a href="https://github.com/sponsors/xlollx" target="_blank" rel="noopener">GitHub Sponsors</a>.'
renamed: '<strong>Songport artık Trackhop.</strong> Aynı uygulama, aynı kod, aynı güncellemeler: yalnızca ad değişti, çünkü aynı alanda "SongPort" adlı ilgisiz bir servis var. Kurulu uygulaman normal şekilde güncellenir ve tüm verilerini korur, eski bağlantılar da çalışmaya devam eder.'
