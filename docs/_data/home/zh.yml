title: Trackhop
description: 让你的歌单在 Spotify、Apple Music、YouTube Music、Amazon Music、TIDAL、Deezer 和你自己的音乐服务器之间始终保持一致。只需手机，无需账号，无需服务器。
h1: "你的歌单，<br>随处同步。"
lead: Trackhop 在各个音乐服务之间同步歌单，可手动，也可定时。
sub: "免费开源。无需账号、服务器或订阅：一切都在你的手机上运行。"
