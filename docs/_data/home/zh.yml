what_title: 它能做什么
what_intro: 选好来源和目标，设定同步频率。Trackhop 会在另一端找到每一首歌，先告诉你会有哪些变化，再让两边始终保持一致。
card1_title: 任意服务互通
card1: "歌单、喜欢的歌曲、收藏的专辑和关注的艺人。也可以粘贴任何公开歌单的链接，或者和各用各的服务的朋友共享一个歌单。"
card2_title: 定时同步
card2: "每小时、每 6 小时、每天或每周。可以只添加，也可以同步删除，并保持来源的歌曲顺序。也能双向同步，删除也一并同步。"
card3_title: 绝不瞎猜
card3: "每次同步前都有预览。没找到的歌曲会进入待检查列表：选对一次，Trackhop 就会记住。"
card4_title: 账号始终属于你
card4: 在各服务自己的页面上登录。访问令牌在手机上加密保存，绝不离开手机。
card5_title: 你自己的音乐服务器
card5: "除了流媒体服务，还支持 Navidrome 等 Subsonic 服务器、Jellyfin、Emby、Plex、Lyrion 和 Mopidy，并列出你的服务器还缺的歌曲。也支持文件：CSV、M3U、XML、JSON。 <a href='https://www.navidrome.org/apps/'>已收录于 Navidrome 应用目录。</a>"
card6_title: 歌单工具
card6: "备份、去重、合并、拆分和排序，用你自己的 AI 密钥驱动的歌单生成器，以及你歌单中艺人的新发行、演唱会、演出曲目和唱片。"
one_title: "只用一个服务也行"
one_intro: "不需要第二个服务。即使你只用 Spotify、Apple Music、YouTube Music 或其他任何一个，Trackhop 也能照看你的歌单。"
one1_title: "保存 Discover Weekly"
one1: "每周在 Discover Weekly、Release Radar 或 daylist 更新之前，把它们复制到你自己的歌单。"
one1_href: "/guide/save-discover-weekly"
one2_title: "自动备份"
one2: "每个歌单和你喜欢的歌曲，每天或每周以带日期的文件保存到你选择的文件夹。"
one2_href: "/guide/backup-spotify-playlists"
one3_title: "删除重复歌曲"
one3: "出现两次的歌曲，即使来自不同专辑，也能一次找出并删除。保留第一份。"
one3_href: "/guide/remove-duplicates-spotify"
one4_title: "修复变灰的歌曲"
one4: "无法再播放的歌曲，在原位置换成可以播放的版本。可以撤销。"
one4_href: "/guide/fix-greyed-out-songs"
one5_title: "随时生成你的 Wrapped"
one5: "常听艺人、年代分布和你的“音乐年龄”，做成适合快拍的卡片，随时生成，保留历史。"
one5_href: "/guide/wrapped-anytime"
one6_title: "Shazam、电台、排行榜"
one6: "你的 Shazam 记录、电台播放的歌、TikTok 里的歌，或某个国家的 Top 100，直接进歌单。"
one6_href: "/guide/shazam"
one_more: "了解用法"
