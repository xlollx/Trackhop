also_title: 也可以在电脑或 NAS 上运行
also_intro: "想在没有手机的情况下试试，或者让同步在一台常开的机器上持续运行？同一个引擎可以在电脑和服务器上运行，并提供网页来连接服务和创建同步。两者都是<strong>测试版</strong>：日常使用没问题，但还比较新，所以请备份好你的设置，遇到问题告诉我们。"
desktop_intro: '适用于 Windows、macOS 和 Linux 的 <strong>Trackhop Desktop</strong>：像普通软件一样安装，无需 Docker 或 Java，也无需管理员权限。它常驻在时钟旁边，电脑开着时就会执行定时同步。版本 %V%（<a href="https://github.com/xlollx/Trackhop/releases/tag/server-v%V%">更新内容</a>）。'
