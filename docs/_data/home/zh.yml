docker_intro: '<strong>Docker</strong> <span class="stage">测试版</span>，适用于家庭服务器、NAS 或 Raspberry Pi：'
docker_password: zixuan-mima
docker_after: '然后打开 <code>http://127.0.0.1:8080</code>。要更新，拉取镜像并重新启动容器即可：你的同步都保存在卷中。设置、Docker Compose 以及支持的功能，请看 <a href="/guide/docker"><strong>Docker 指南</strong></a>。也已在 <a href="https://hub.docker.com/r/xlollx/trackhop">Docker Hub</a> 上发布为 <code>xlollx/trackhop</code>。可以在 <a href="/guide/playlist-sync-nas">NAS（Synology、Unraid、TrueNAS）</a>上运行，或者<a href="/guide/self-hosted-playlist-sync">与 Navidrome、Jellyfin、Plex 放在一起</a>。全家使用时，<a href="/guide/docker#several-people-on-one-server">每人一个账号</a>：每个人登录后都有自己的服务和同步。'
azure_before: '<strong>在 Azure 上</strong> <span class="stage">测试版</span>，家里不用服务器：'
azure_after: '在你自己的 Azure 订阅中创建 Trackhop（Container Apps、HTTPS，数据存于 Azure Files）。费用计入你的订阅：在两次同步之间闲置时，大多数区域每月约 &#36;5；如果一直繁忙，最多约 &#36;15（根据 Container Apps 扣除每月免费额度后的 Azure 标价估算；存储只需几美分）。<a href="/guide/docker#on-azure-beta">了解更多</a>。'
both_have: "两者都拥有与应用相同的外观、未找到歌曲的检查、各种格式的文件歌单，以及应用的工具：导出、完整备份（也可定时）、去重、无法播放的歌曲、AI 歌单和你的统计数据。"
data_title: Trackhop 如何使用你的数据
data1: "Trackhop 通过各服务自己的登录方式，连接你选择的音乐服务（Spotify、YouTube Music、Apple Music、Amazon Music、TIDAL、Deezer、个人服务器）。它会读取你的歌单及其中的歌曲；当你开始或设定同步时，会在你自己的账号中创建歌单、添加或移除歌曲。对于通过 Google API 连接的 YouTube Music，这意味着使用 YouTube Data API 的 <code>youtube</code> 权限，仅用于你的歌单，且仅在你的设备上进行。"
data2: '访问令牌加密保存在手机上，绝不会发送给 Trackhop 的开发者或任何第三方。Trackhop 没有服务器。详情见<a href="/privacy-policy">隐私政策</a>。'
start_title: 开始使用
start_intro: 'Android 8.0 或更高版本，支持英语、意大利语、法语、德语、西班牙语、葡萄牙语、波兰语、俄语、土耳其语、中文、日语和韩语。不确定选哪个版本？<a href="/guide/versions">选哪个 Trackhop？</a>有对比。<a href="/guide/">指南</a>会带你完成第一次同步并解决常见错误；如果有什么地方和说明不符，<em>日志 → 在 GitHub 上报告</em> 会打开一份已填好详细信息的报告。'
start_apk: 或从 GitHub 下载 APK
step_by_step: '分步教程：<a href="/guide/spotify-to-youtube-music">Spotify 到 YouTube Music</a> · <a href="/guide/apple-music-to-spotify">Apple Music 到 Spotify</a> · <a href="/guide/spotify-to-tidal">Spotify 到 TIDAL</a> · <a href="/guide/spotify-to-apple-music">Spotify 到 Apple Music</a> · <a href="/guide/youtube-music-to-spotify">YouTube Music 到 Spotify</a> · <a href="/guide/deezer-to-spotify">Deezer 到 Spotify</a> · <a href="/guide/amazon-music-to-spotify">Amazon Music 到 Spotify</a> · <a href="/guide/spotify-to-navidrome-jellyfin">Spotify 到 Navidrome、Jellyfin 或 Plex</a> · <a href="/guide/export-playlist-csv">把歌单导出为 CSV 或 M3U</a> · <a href="/guide/shazam">把 Shazam 记录做成歌单</a>。中文指南：<a href="/guide/netease-qq-music-zh">网易云音乐、QQ音乐歌单同步</a> · <a href="/guide/playlist-transfer-zh">免费迁移歌单</a>。'
no_phone: '手边没有 Android 手机？在 Windows 或 Linux 上<a href="#docker">试试 Trackhop Desktop</a>，或者使用 Docker 版。'
play_bridge: '用的是 Google Play 版？<a href="https://github.com/xlollx/Trackhop-Bridge/releases/latest"><strong>下载 Trackhop Bridge</strong></a>，这个插件可以添加 YouTube Music、Amazon Music，以及无需开发者密钥的 Spotify 和 Apple Music（使用非官方网页接口：请先阅读说明）。'
thanks_title: 感谢
thanks_how: '感谢让 Trackhop 保持免费的各位。想让你的名字出现在这里？<a href="https://ko-fi.com/xlollx" target="_blank" rel="noopener">Ko-fi</a> (银行卡或 PayPal) 或 <a href="https://github.com/sponsors/xlollx" target="_blank" rel="noopener">GitHub Sponsors</a>。'
renamed: '<strong>Songport 现已更名为 Trackhop。</strong>同样的应用、同样的代码、同样的更新：只是改了名字，因为同一领域有一个毫不相关的服务叫“SongPort”。已安装的应用会照常更新并保留所有数据，旧链接也依然有效。'
