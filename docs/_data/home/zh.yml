why_title: 为什么不用在线迁移服务？
why_intro: 'Soundiiz、TuneMyMusic 和 FreeYourMusic 适合一次性迁移。Trackhop 则是为了长期保持歌单同步，而且不用把账号交给任何人。详细对比：<a href="/guide/soundiiz-alternative">Trackhop 与 Soundiiz</a>、<a href="/guide/tunemymusic-alternative">Trackhop 与 TuneMyMusic</a>。'
