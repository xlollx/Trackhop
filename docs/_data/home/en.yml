title: Trackhop
description: Keep your playlists identical across Spotify, Apple Music, YouTube Music, Amazon Music, TIDAL, Deezer and your own music server. On your phone, no account, no server.
h1: "Your playlists,<br>everywhere."
lead: Trackhop keeps playlists in sync across music services, by hand or on a schedule.
sub: "Free and open source. No account, no server, no subscription: everything runs on your phone."
