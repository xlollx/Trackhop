what_title: What it does
what_intro: Pick a source and a target, choose how often. Trackhop finds every track on the other side, shows you what will change, and keeps both in step.
card1_title: Any service to any service
card1: Playlists, liked songs, saved albums and followed artists. Or paste the link of any public playlist.
card2_title: On a schedule
card2: Hourly, every 6 hours, daily or weekly. Additions only, or mirror removals too, and keep the source's order.
card3_title: Nothing guessed
card3: "A preview before every sync. Tracks that were not found go to a review: pick the right one once, Trackhop remembers it."
card4_title: Your accounts stay yours
card4: You sign in on each service's own page. Access tokens are encrypted on the phone and never leave it.
card5_title: Your own music server
card5: "Navidrome and other Subsonic servers, Jellyfin and Plex, next to the streaming services. Files too: CSV, M3U, XML, JSON."
card6_title: Playlist tools
card6: Backups, duplicate removal, merge, split and sort, and a playlist generator driven by your own AI key.
one_title: "Even with just one service"
one_intro: "No second service needed. If you only use Spotify, Apple Music, YouTube Music or any other, Trackhop still looks after your playlists."
one1_title: "Save Discover Weekly"
one1: "Discover Weekly, Release Radar or your daylist copied into a playlist of yours every week, before they change."
one1_href: "/guide/save-discover-weekly"
one2_title: "Automatic backups"
one2: "Every playlist and your liked songs saved as dated files, daily or weekly, in a folder you choose."
one2_href: "/guide/backup-spotify-playlists"
one3_title: "Remove duplicates"
one3: "Songs that appear twice, even from another album, found and removed in one go. The first copy stays."
one3_href: "/guide/remove-duplicates-spotify"
one4_title: "Fix greyed-out songs"
one4: "Tracks that no longer play swapped for a version that does, in the same spot. With Undo."
one4_href: "/guide/fix-greyed-out-songs"
one5_title: "Your Wrapped, any time"
one5: "Top artists, decades and your musical age on a card for your stories, whenever you want, with a history."
one5_href: "/guide/wrapped-anytime"
one6_title: "Shazam, radio, charts"
one6: "Your Shazams, what a radio station plays, the song in a TikTok or a country's Top 100, straight into a playlist."
one6_href: "/guide/shazam"
