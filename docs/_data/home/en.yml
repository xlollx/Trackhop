docker_intro: "<strong>Docker</strong> <span class=\"stage\">beta</span>, for a home server, a NAS or a Raspberry Pi:"
docker_password: choose-one
docker_after: 'Then open <code>http://127.0.0.1:8080</code>. To update, pull the image and start the container again: your syncs stay in the volume. Settings, Docker Compose and what works there: <a href="/guide/docker"><strong>the Docker guide</strong></a>. Also on <a href="https://hub.docker.com/r/xlollx/trackhop">Docker Hub</a> as <code>xlollx/trackhop</code>. On a <a href="/guide/playlist-sync-nas">NAS (Synology, Unraid, TrueNAS)</a>, or <a href="/guide/self-hosted-playlist-sync">next to Navidrome, Jellyfin or Plex</a>. For the whole household, <a href="/guide/docker#several-people-on-one-server">one account each</a>: everyone signs in and has their own services and syncs.'
azure_before: "<strong>On Azure</strong> <span class=\"stage\">beta</span>, no server at home:"
azure_after: 'creates Trackhop in your own Azure subscription (Container Apps, HTTPS, data on Azure Files). Billed to your subscription: about &#36;5 a month in most regions when it sits idle between syncs, up to about &#36;15 if it is busy all the time (estimate from Azure''s list prices for Container Apps after its monthly free grant; storage costs cents). <a href="/guide/docker#on-azure-beta">More</a>.'
both_have: "Both have the app's look, the review of tracks not found, File playlists in every format, and the app's Tools: export, full backups (also on a schedule), duplicates, unplayable tracks, AI playlists and your numbers."
data_title: How Trackhop uses your data
data1: "Trackhop connects to the music services you choose (Spotify, YouTube Music, Apple Music, Amazon Music, TIDAL, Deezer, personal servers) with each service's own sign-in. It reads your playlists and their tracks, and, when you start or schedule a sync, creates playlists and adds or removes tracks in your own account. For YouTube Music through Google's API this means the YouTube Data API with the <code>youtube</code> permission, used only for your playlists and only on your device."
data2: 'Access tokens are stored encrypted on the phone and never sent to Trackhop''s developer or to any third party. There is no Trackhop server. Details in the <a href="/privacy-policy">privacy policy</a>.'
start_title: Get started
start_intro: 'Android 8.0 or newer, in English, Italian, French, German, Spanish, Portuguese, Polish, Russian, Turkish, Chinese, Japanese and Korean. Not sure which build to take? <a href="/guide/versions">Which Trackhop?</a> compares them. The <a href="/guide/">guide</a> walks through the first sync and the common errors; if something does not work as described, <em>Log → Report on GitHub</em> opens a report with the details filled in.'
start_apk: or the APK from GitHub
step_by_step: 'Step by step: <a href="/guide/spotify-to-youtube-music">Spotify to YouTube Music</a> · <a href="/guide/apple-music-to-spotify">Apple Music to Spotify</a> · <a href="/guide/spotify-to-tidal">Spotify to TIDAL</a> · <a href="/guide/spotify-to-apple-music">Spotify to Apple Music</a> · <a href="/guide/youtube-music-to-spotify">YouTube Music to Spotify</a> · <a href="/guide/deezer-to-spotify">Deezer to Spotify</a> · <a href="/guide/amazon-music-to-spotify">Amazon Music to Spotify</a> · <a href="/guide/spotify-to-navidrome-jellyfin">Spotify to Navidrome, Jellyfin or Plex</a> · <a href="/guide/export-playlist-csv">a playlist to CSV or M3U</a> · <a href="/guide/shazam">your Shazams in a playlist</a>. In italiano: <a href="/guide/trasferire-playlist">trasferire playlist</a>.'
no_phone: 'No Android phone at hand? <a href="#docker">Try Trackhop Desktop</a> on Windows or Linux, or the Docker version.'
play_bridge: 'Using the Google Play version? <a href="https://github.com/xlollx/Trackhop-Bridge/releases/latest"><strong>Download Trackhop Bridge</strong></a>, the plugin that adds YouTube Music, Amazon Music, and Spotify and Apple Music without developer keys (unofficial web interfaces: read its notes first).'
thanks_title: Thank you
thanks_how: 'to the people who keep Trackhop free. Want your name here? <a href="https://ko-fi.com/xlollx" target="_blank" rel="noopener">Ko-fi</a> or <a href="https://github.com/sponsors/xlollx" target="_blank" rel="noopener">GitHub Sponsors</a>.'
renamed: '<strong>Songport is now Trackhop.</strong> Same app, same code, same updates: only the name changed, because an unrelated service called "SongPort" works in the same space. Your installed app updates normally and keeps all its data, and old links keep working.'
