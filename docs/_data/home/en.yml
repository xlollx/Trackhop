why_title: Why not an online transfer service?
why_intro: 'Soundiiz, TuneMyMusic and FreeYourMusic are good at a one-off move. Trackhop is for keeping playlists in step over time, without handing your accounts to anyone. Side by side: <a href="/guide/soundiiz-alternative">Trackhop and Soundiiz</a>, <a href="/guide/tunemymusic-alternative">Trackhop and TuneMyMusic</a>.'
