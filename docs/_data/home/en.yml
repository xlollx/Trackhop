also_title: Also on a computer or a NAS
also_intro: "Want to try it without a phone, or keep syncs running on a machine that is always on? The same engine runs on your computer and on a server, with a web page to connect services and create syncs. Both are a <strong>beta</strong>: they work for everyday use but are still young, so keep a copy of your set-up and tell us what breaks."
desktop_intro: '<strong>Trackhop Desktop</strong> for Windows, macOS and Linux: install it like any program, no Docker or Java needed, no administrator rights. It sits next to the clock and runs scheduled syncs while the computer is on. Version %V% (<a href="https://github.com/xlollx/Trackhop/releases/tag/server-v%V%">what''s in it</a>).'
