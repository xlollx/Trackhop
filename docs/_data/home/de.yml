also_title: Auch auf dem Computer oder einem NAS
also_intro: "Du willst es ohne Handy ausprobieren oder Syncs auf einem Gerät laufen lassen, das immer an ist? Dieselbe Engine läuft auf deinem Computer und auf einem Server, mit einer Weboberfläche, um Dienste zu verbinden und Syncs anzulegen. Beides ist eine <strong>Beta</strong>: im Alltag gut nutzbar, aber noch jung. Sichere also deine Einrichtung und sag uns, was nicht funktioniert."
desktop_intro: '<strong>Trackhop Desktop</strong> für Windows, macOS und Linux: Installation wie bei jedem anderen Programm, ohne Docker oder Java, ohne Administratorrechte. Es sitzt neben der Uhr und führt geplante Syncs aus, solange der Computer läuft. Version %V% (<a href="https://github.com/xlollx/Trackhop/releases/tag/server-v%V%">was ist neu</a>).'
