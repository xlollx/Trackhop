docker_intro: '<strong>Docker</strong> <span class="stage">Beta</span>, für einen Heimserver, ein NAS oder einen Raspberry Pi:'
docker_password: waehle-eins
docker_after: 'Dann öffne <code>http://127.0.0.1:8080</code>. Zum Aktualisieren das Image neu ziehen und den Container erneut starten: deine Syncs bleiben im Volume. Einstellungen, Docker Compose und was dort funktioniert: <a href="/guide/docker"><strong>die Docker-Anleitung</strong></a>. Auch auf <a href="https://hub.docker.com/r/xlollx/trackhop">Docker Hub</a> als <code>xlollx/trackhop</code>. Auf einem <a href="/guide/playlist-sync-nas">NAS (Synology, Unraid, TrueNAS)</a> oder <a href="/guide/self-hosted-playlist-sync">neben Navidrome, Jellyfin oder Plex</a>. Für den ganzen Haushalt <a href="/guide/docker#several-people-on-one-server">ein Konto pro Person</a>: alle melden sich an und haben ihre eigenen Dienste und Syncs.'
azure_before: '<strong>Auf Azure</strong> <span class="stage">Beta</span>, ganz ohne Server zu Hause:'
azure_after: 'legt Trackhop in deinem eigenen Azure-Abonnement an (Container Apps, HTTPS, Daten auf Azure Files). Abgerechnet wird über dein Abonnement: in den meisten Regionen etwa 5 &#36; im Monat, wenn es zwischen den Syncs ruht, bis zu etwa 15 &#36;, wenn es ständig beschäftigt ist (geschätzt nach den Azure-Listenpreisen für Container Apps nach dem monatlichen Freikontingent; Speicher kostet nur Cents). <a href="/guide/docker#on-azure-beta">Mehr</a>.'
both_have: "Beide haben das Aussehen der App, die Prüfung nicht gefundener Titel, Datei-Playlists in jedem Format und die Werkzeuge der App: Export, vollständige Backups (auch nach Zeitplan), Duplikate, nicht abspielbare Titel, KI-Playlists und deine Zahlen."
data_title: Wie Trackhop deine Daten verwendet
data1: "Trackhop verbindet sich mit den Musikdiensten, die du auswählst (Spotify, YouTube Music, Apple Music, Amazon Music, TIDAL, Deezer, eigene Server), über die Anmeldung des jeweiligen Dienstes. Es liest deine Playlists und ihre Titel und legt, wenn du einen Sync startest oder planst, in deinem eigenen Konto Playlists an und fügt Titel hinzu oder entfernt sie. Für YouTube Music über die Google-API bedeutet das die YouTube Data API mit der Berechtigung <code>youtube</code>, die nur für deine Playlists und nur auf deinem Gerät genutzt wird."
data2: 'Zugriffstokens werden verschlüsselt auf dem Handy gespeichert und nie an den Entwickler von Trackhop oder an Dritte gesendet. Es gibt keinen Trackhop-Server. Details in der <a href="/privacy-policy">Datenschutzerklärung</a>.'
start_title: Loslegen
start_intro: 'Android 8.0 oder neuer, auf Englisch, Italienisch, Französisch, Deutsch, Spanisch, Portugiesisch, Polnisch, Russisch, Türkisch, Chinesisch, Japanisch und Koreanisch. Unsicher, welche Variante die richtige ist? <a href="/guide/versions">Welches Trackhop?</a> vergleicht sie. Die <a href="/guide/">Anleitung</a> führt durch den ersten Sync und die häufigsten Fehler; wenn etwas nicht wie beschrieben funktioniert, öffnet <em>Protokoll → Auf GitHub melden</em> eine Meldung mit bereits ausgefüllten Details.'
start_apk: oder die APK von GitHub
step_by_step: 'Schritt für Schritt: <a href="/guide/spotify-to-youtube-music">Spotify zu YouTube Music</a> · <a href="/guide/apple-music-to-spotify">Apple Music zu Spotify</a> · <a href="/guide/spotify-to-tidal">Spotify zu TIDAL</a> · <a href="/guide/spotify-to-apple-music">Spotify zu Apple Music</a> · <a href="/guide/youtube-music-to-spotify">YouTube Music zu Spotify</a> · <a href="/guide/deezer-to-spotify">Deezer zu Spotify</a> · <a href="/guide/amazon-music-to-spotify">Amazon Music zu Spotify</a> · <a href="/guide/spotify-to-navidrome-jellyfin">Spotify zu Navidrome, Jellyfin oder Plex</a> · <a href="/guide/export-playlist-csv">eine Playlist als CSV oder M3U</a> · <a href="/guide/shazam">deine Shazams in einer Playlist</a>. Auf Deutsch: <a href="/guide/playlists-uebertragen">Playlists übertragen</a>.'
no_phone: 'Kein Android-Handy zur Hand? <a href="#docker">Probier Trackhop Desktop</a> unter Windows oder Linux aus, oder die Docker-Version.'
play_bridge: 'Du nutzt die Version aus Google Play oder der AppGallery? <a href="https://github.com/xlollx/Trackhop-Bridge/releases/latest"><strong>Lade Trackhop Bridge herunter</strong></a>, das Plugin, das YouTube Music, Amazon Music sowie Spotify und Apple Music ohne Entwicklerschlüssel hinzufügt (inoffizielle Weboberflächen: lies zuerst die Hinweise).'
thanks_title: Danke
thanks_how: 'an alle, die Trackhop kostenlos halten. Möchtest du deinen Namen hier sehen? <a href="https://ko-fi.com/xlollx" target="_blank" rel="noopener">Ko-fi</a> oder <a href="https://github.com/sponsors/xlollx" target="_blank" rel="noopener">GitHub Sponsors</a>.'
renamed: '<strong>Songport heißt jetzt Trackhop.</strong> Gleiche App, gleicher Code, gleiche Updates: nur der Name hat sich geändert, weil ein anderer, nicht verwandter Dienst namens „SongPort“ im selben Bereich unterwegs ist. Deine installierte App aktualisiert sich ganz normal und behält alle Daten, und alte Links funktionieren weiter.'
