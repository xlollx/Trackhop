also_title: Também no computador ou em um NAS
also_intro: "Quer testar sem celular, ou manter as sincronizações rodando em uma máquina sempre ligada? O mesmo motor roda no seu computador e em um servidor, com uma página web para conectar serviços e criar sincronizações. Os dois estão em <strong>beta</strong>: funcionam no dia a dia mas ainda são novos, então guarde uma cópia da sua configuração e conte pra gente o que quebrar."
desktop_intro: '<strong>Trackhop Desktop</strong> para Windows, macOS e Linux: instale como qualquer programa, sem Docker nem Java, sem direitos de administrador. Fica ao lado do relógio e roda as sincronizações agendadas enquanto o computador estiver ligado. Versão %V% (<a href="https://github.com/xlollx/Trackhop/releases/tag/server-v%V%">o que há de novo</a>).'
