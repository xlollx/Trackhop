docker_intro: '<strong>Docker</strong> <span class="stage">beta</span>, para um servidor doméstico, um NAS ou um Raspberry Pi:'
docker_password: escolha-uma
docker_after: 'Depois abra <code>http://127.0.0.1:8080</code>. Para atualizar, baixe a imagem e inicie o contêiner de novo: suas sincronizações ficam no volume. Configurações, Docker Compose e o que funciona ali: <a href="/guide/docker"><strong>o guia do Docker</strong></a>. Também no <a href="https://hub.docker.com/r/xlollx/trackhop">Docker Hub</a> como <code>xlollx/trackhop</code>. Em um <a href="/guide/playlist-sync-nas">NAS (Synology, Unraid, TrueNAS)</a>, ou <a href="/guide/self-hosted-playlist-sync">ao lado do Navidrome, Jellyfin ou Plex</a>. Para a casa toda, <a href="/guide/docker#several-people-on-one-server">uma conta para cada um</a>: cada pessoa entra e tem seus próprios serviços e sincronizações.'
azure_before: '<strong>No Azure</strong> <span class="stage">beta</span>, sem servidor em casa:'
azure_after: 'cria o Trackhop na sua própria assinatura do Azure (Container Apps, HTTPS, dados no Azure Files). Cobrado na sua assinatura: cerca de &#36;5 por mês na maioria das regiões quando fica ocioso entre as sincronizações, até cerca de &#36;15 se estiver ocupado o tempo todo (estimativa pelos preços de tabela do Azure para Container Apps após a cota gratuita mensal; o armazenamento custa centavos). <a href="/guide/docker#on-azure-beta">Mais</a>.'
both_have: "Os dois têm o visual do app, a revisão das faixas não encontradas, playlists de arquivo em todos os formatos e as Ferramentas do app: exportação, backups completos (também agendados), duplicadas, faixas que não tocam, playlists com IA e Seus números."
data_title: Como o Trackhop usa seus dados
data1: "O Trackhop se conecta aos serviços de música que você escolher (Spotify, YouTube Music, Apple Music, Amazon Music, TIDAL, Deezer, servidores pessoais) com o login de cada serviço. Ele lê suas playlists e as faixas delas e, quando você inicia ou agenda uma sincronização, cria playlists e adiciona ou remove faixas na sua própria conta. Para o YouTube Music pela API do Google, isso significa a YouTube Data API com a permissão <code>youtube</code>, usada só para as suas playlists e só no seu dispositivo."
data2: 'Os tokens de acesso ficam criptografados no celular e nunca são enviados ao desenvolvedor do Trackhop nem a terceiros. Não existe servidor do Trackhop. Detalhes na <a href="/privacy-policy">política de privacidade</a>.'
start_title: Comece
start_intro: 'Android 8.0 ou superior, em inglês, italiano, francês, alemão, espanhol, português, polonês, russo, turco, chinês, japonês e coreano. Não sabe qual versão pegar? <a href="/guide/versions">Qual Trackhop?</a> compara as opções. O <a href="/guide/">guia</a> acompanha a primeira sincronização e os erros mais comuns; se algo não funcionar como descrito, <em>Registro → Reportar no GitHub</em> abre um relato com os detalhes já preenchidos.'
start_apk: ou o APK do GitHub
step_by_step: 'Passo a passo: <a href="/guide/spotify-to-youtube-music">do Spotify para o YouTube Music</a> · <a href="/guide/apple-music-to-spotify">do Apple Music para o Spotify</a> · <a href="/guide/spotify-to-tidal">do Spotify para o TIDAL</a> · <a href="/guide/spotify-to-apple-music">do Spotify para o Apple Music</a> · <a href="/guide/youtube-music-to-spotify">do YouTube Music para o Spotify</a> · <a href="/guide/deezer-to-spotify">do Deezer para o Spotify</a> · <a href="/guide/amazon-music-to-spotify">do Amazon Music para o Spotify</a> · <a href="/guide/spotify-to-navidrome-jellyfin">do Spotify para Navidrome, Jellyfin ou Plex</a> · <a href="/guide/export-playlist-csv">uma playlist em CSV ou M3U</a> · <a href="/guide/shazam">seus Shazams em uma playlist</a>. Guias em português: <a href="/guide/primeiros-passos">Primeiros passos com o Trackhop</a> · <a href="/guide/transferir-playlist">Transferir playlists entre Spotify, YouTube Music, Apple Music e Deezer</a>.'
no_phone: 'Sem um celular Android à mão? <a href="#docker">Experimente o Trackhop Desktop</a> no Windows ou Linux, ou a versão Docker.'
play_bridge: 'Usa a versão do Google Play ou AppGallery? <a href="https://github.com/xlollx/Trackhop-Bridge/releases/latest"><strong>Baixe o Trackhop Bridge</strong></a>, o plugin que adiciona YouTube Music, Amazon Music, e Spotify e Apple Music sem chaves de desenvolvedor (interfaces web não oficiais: leia as notas dele antes).'
thanks_title: Obrigado
thanks_how: 'a quem mantém o Trackhop gratuito. Quer seu nome aqui? <a href="https://ko-fi.com/xlollx" target="_blank" rel="noopener">Ko-fi</a> (cartão ou PayPal) ou <a href="https://github.com/sponsors/xlollx" target="_blank" rel="noopener">GitHub Sponsors</a>.'
renamed: '<strong>O Songport agora é Trackhop.</strong> Mesmo app, mesmo código, mesmas atualizações: só o nome mudou, porque um serviço sem relação chamado "SongPort" atua na mesma área. O app instalado se atualiza normalmente e mantém todos os dados, e os links antigos continuam funcionando.'
