why_title: Por que não um serviço de transferência online?
why_intro: 'Soundiiz, TuneMyMusic e FreeYourMusic são bons para uma mudança única. O Trackhop serve para manter as playlists em dia ao longo do tempo, sem entregar suas contas a ninguém. Lado a lado: <a href="/guide/soundiiz-alternative">Trackhop e Soundiiz</a>, <a href="/guide/tunemymusic-alternative">Trackhop e TuneMyMusic</a>.'
