docker_password: bimilbeonho-jeonghagi
docker_after: '그다음 <code>http://127.0.0.1:8080</code>을 여세요. 업데이트하려면 이미지를 pull하고 컨테이너를 다시 시작하면 돼요: 동기화는 볼륨에 그대로 남아요. 설정, Docker Compose, 지원 기능은 <a href="/guide/docker"><strong>Docker 가이드</strong></a>를 보세요. <a href="https://hub.docker.com/r/xlollx/trackhop">Docker Hub</a>에도 <code>xlollx/trackhop</code>으로 올라가 있어요. <a href="/guide/playlist-sync-nas">NAS(Synology, Unraid, TrueNAS)</a>에서, 또는 <a href="/guide/self-hosted-playlist-sync">Navidrome, Jellyfin, Plex 옆에서</a> 쓸 수 있어요. 온 가족이 쓴다면 <a href="/guide/docker#several-people-on-one-server">각자 계정</a>으로: 모두 로그인해서 자기만의 서비스와 동기화를 가져요.'
azure_before: '<strong>Azure에서</strong> <span class="stage">베타</span>, 집에 서버가 없어도:'
azure_after: '내 Azure 구독에 Trackhop을 만들어요(Container Apps, HTTPS, 데이터는 Azure Files에). 요금은 내 구독으로 청구돼요: 동기화 사이에 대기만 할 때는 대부분 리전에서 월 약 &#36;5, 계속 바쁘게 돌면 최대 약 &#36;15예요(Container Apps 월 무료 제공량을 뺀 Azure 정가 기준 추정, 스토리지는 몇 센트 수준). <a href="/guide/docker#on-azure-beta">더 보기</a>.'
both_have: "둘 다 앱과 같은 모습에, 찾지 못한 곡 검토, 모든 형식의 파일 플레이리스트, 그리고 앱의 도구(내보내기, 전체 백업(예약도 가능), 중복, 재생할 수 없는 곡, AI 플레이리스트, 통계)를 갖추고 있어요."
data_title: Trackhop의 데이터 사용 방식
data1: "Trackhop은 사용자가 고른 음악 서비스(Spotify, YouTube Music, Apple Music, Amazon Music, TIDAL, Deezer, 개인 서버)에 각 서비스 자체의 로그인으로 연결해요. 플레이리스트와 그 곡들을 읽고, 동기화를 시작하거나 예약하면 사용자 본인의 계정에서 플레이리스트를 만들고 곡을 추가하거나 삭제해요. Google API를 통한 YouTube Music의 경우 YouTube Data API의 <code>youtube</code> 권한을 사용하며, 오직 사용자의 플레이리스트에만, 사용자의 기기에서만 쓰여요."
data2: '액세스 토큰은 휴대폰에 암호화되어 저장되며 Trackhop 개발자나 어떤 제3자에게도 전송되지 않아요. Trackhop 서버는 존재하지 않아요. 자세한 내용은 <a href="/privacy-policy">개인정보 처리방침</a>을 보세요.'
start_title: 시작하기
start_intro: 'Android 8.0 이상, 영어, 이탈리아어, 프랑스어, 독일어, 스페인어, 포르투갈어, 폴란드어, 러시아어, 튀르키예어, 중국어, 일본어, 한국어 지원. 어떤 빌드를 받을지 모르겠다면 <a href="/guide/versions">어떤 Trackhop?</a>에서 비교해 보세요. <a href="/guide/">가이드</a>에서 첫 동기화와 흔한 오류를 안내해요. 설명대로 동작하지 않으면 <em>로그 → GitHub에 신고</em>로 세부 정보가 채워진 보고서를 열 수 있어요.'
start_apk: 또는 GitHub에서 APK
step_by_step: '단계별 안내: <a href="/guide/spotify-to-youtube-music">Spotify에서 YouTube Music으로</a> · <a href="/guide/apple-music-to-spotify">Apple Music에서 Spotify로</a> · <a href="/guide/spotify-to-tidal">Spotify에서 TIDAL로</a> · <a href="/guide/spotify-to-apple-music">Spotify에서 Apple Music으로</a> · <a href="/guide/youtube-music-to-spotify">YouTube Music에서 Spotify로</a> · <a href="/guide/deezer-to-spotify">Deezer에서 Spotify로</a> · <a href="/guide/amazon-music-to-spotify">Amazon Music에서 Spotify로</a> · <a href="/guide/spotify-to-navidrome-jellyfin">Spotify에서 Navidrome, Jellyfin, Plex로</a> · <a href="/guide/export-playlist-csv">플레이리스트를 CSV나 M3U로</a> · <a href="/guide/shazam">Shazam 기록을 플레이리스트로</a>. 한국어 가이드: <a href="/guide/playlist-transfer-ko">플레이리스트 무료로 옮기기</a>.'
no_phone: 'Android 휴대폰이 없나요? Windows나 Linux에서 <a href="#docker">Trackhop Desktop을 써 보거나</a> Docker 버전을 사용해 보세요.'
play_bridge: 'Google Play 또는 AppGallery 버전을 쓰고 있나요? <a href="https://github.com/xlollx/Trackhop-Bridge/releases/latest"><strong>Trackhop Bridge 다운로드</strong></a>: YouTube Music, Amazon Music, 그리고 개발자 키 없이 Spotify와 Apple Music을 추가하는 플러그인이에요(비공식 웹 인터페이스를 쓰니 먼저 안내를 읽어 주세요).'
thanks_title: 감사합니다
thanks_how: 'Trackhop을 무료로 유지해 주시는 분들께. 여기에 이름을 올리고 싶다면 <a href="https://ko-fi.com/xlollx" target="_blank" rel="noopener">Ko-fi</a> 또는 <a href="https://github.com/sponsors/xlollx" target="_blank" rel="noopener">GitHub Sponsors</a>로.'
renamed: '<strong>Songport가 Trackhop이 되었어요.</strong> 앱도, 코드도, 업데이트도 그대로이고 이름만 바뀌었어요. 같은 분야에 "SongPort"라는 무관한 서비스가 있기 때문이에요. 설치된 앱은 평소처럼 업데이트되고 모든 데이터가 유지되며, 예전 링크도 계속 작동해요.'
