why_intro: 'Soundiiz, TuneMyMusic, FreeYourMusic은 한 번 옮기는 데는 좋아요. Trackhop은 계정을 누구에게도 맡기지 않고 플레이리스트를 오래도록 똑같이 유지하기 위한 앱이에요. 나란히 비교: <a href="/guide/soundiiz-alternative">Trackhop과 Soundiiz</a>, <a href="/guide/tunemymusic-alternative">Trackhop과 TuneMyMusic</a>.'
