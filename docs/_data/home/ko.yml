also_title: 컴퓨터나 NAS에서도
also_intro: "휴대폰 없이 써 보고 싶거나, 항상 켜져 있는 기기에서 동기화를 계속 돌리고 싶나요? 같은 엔진이 컴퓨터와 서버에서도 돌아가고, 웹 페이지에서 서비스를 연결하고 동기화를 만들 수 있어요. 둘 다 <strong>베타</strong>예요: 일상적으로 쓰기엔 충분하지만 아직 새로우니, 설정을 백업해 두고 문제가 생기면 알려 주세요."
desktop_intro: 'Windows, macOS, Linux용 <strong>Trackhop Desktop</strong>: 일반 프로그램처럼 설치하면 끝. Docker도 Java도 관리자 권한도 필요 없어요. 시계 옆에 머물면서 컴퓨터가 켜져 있는 동안 예약 동기화를 실행해요. 버전 %V% (<a href="https://github.com/xlollx/Trackhop/releases/tag/server-v%V%">변경 사항</a>).'
