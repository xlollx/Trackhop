also_title: Также на компьютере или NAS
also_intro: "Хотите попробовать без телефона или запускать синхронизации на машине, которая всегда включена? Тот же движок работает на компьютере и на сервере, с веб-страницей для подключения сервисов и создания синхронизаций. Обе версии — <strong>бета</strong>: они годятся для повседневного использования, но ещё молоды, поэтому сохраните копию своих настроек и сообщайте нам, что ломается."
desktop_intro: '<strong>Trackhop Desktop</strong> для Windows, macOS и Linux: устанавливается как обычная программа, без Docker и Java, без прав администратора. Живёт рядом с часами и запускает синхронизации по расписанию, пока компьютер включён. Версия %V% (<a href="https://github.com/xlollx/Trackhop/releases/tag/server-v%V%">что нового</a>).'
