what_title: Что он умеет
what_intro: Выберите источник и цель, укажите, как часто. Trackhop найдёт каждый трек на другой стороне, покажет, что изменится, и будет держать оба плейлиста в согласии.
card1_title: Из любого сервиса в любой
card1: "Плейлисты, любимые треки, сохранённые альбомы и исполнители, на которых вы подписаны. Или ссылка на любой публичный плейлист, или один плейлист на компанию друзей, у каждого из которых свой сервис."
card2_title: По расписанию
card2: "Каждый час, каждые 6 часов, ежедневно или еженедельно. Только добавления или ещё и удаления, с сохранением порядка источника. А также в обе стороны, вместе с удалениями."
card3_title: Никаких догадок
card3: "Предпросмотр перед каждой синхронизацией. Ненайденные треки попадают на проверку: выберите правильный один раз — Trackhop его запомнит."
card4_title: Ваши аккаунты остаются вашими
card4: Вы входите на собственной странице каждого сервиса. Токены доступа зашифрованы на телефоне и никогда его не покидают.
card5_title: Ваш собственный музыкальный сервер
card5: "Navidrome и другие серверы Subsonic, Jellyfin, Emby, Plex, Lyrion и Mopidy — рядом со стриминговыми сервисами, со списком треков, которых на вашем сервере ещё нет. А ещё файлы: CSV, M3U, XML, JSON. <a href='https://www.navidrome.org/apps/'>Есть в каталоге приложений Navidrome.</a>"
card6_title: Инструменты для плейлистов
card6: "Резервные копии, удаление дубликатов, объединение, разделение и сортировка, генератор плейлистов на вашем собственном ключе ИИ, а также новинки, концерты, сет-листы и пластинки исполнителей ваших плейлистов."
one_title: "Даже если у вас один сервис"
one_intro: "Второй сервис не нужен. Даже если вы пользуетесь только Spotify, Apple Music, YouTube Music или другим, Trackhop позаботится о ваших плейлистах."
one1_title: "Сохраните Discover Weekly"
one1: "Discover Weekly, Release Radar или ваш daylist каждую неделю копируются в ваш собственный плейлист, пока они не сменились."
one1_href: "/guide/save-discover-weekly"
one2_title: "Автоматические резервные копии"
one2: "Все плейлисты и любимые треки сохраняются в файлы с датой, ежедневно или еженедельно, в выбранную вами папку."
one2_href: "/guide/backup-spotify-playlists"
one3_title: "Удалите дубликаты"
one3: "Треки, которые встречаются дважды, даже из другого альбома, находятся и удаляются за один раз. Первая копия остаётся."
one3_href: "/guide/remove-duplicates-spotify"
one4_title: "Почините серые треки"
one4: "Треки, которые больше не воспроизводятся, заменяются рабочей версией на том же месте. С возможностью отмены."
one4_href: "/guide/fix-greyed-out-songs"
one5_title: "Ваш Wrapped, когда захотите"
one5: "Любимые исполнители, десятилетия и ваш музыкальный возраст на карточке для сторис, когда захотите, с историей."
one5_href: "/guide/wrapped-anytime"
one6_title: "Shazam, радио, чарты"
one6: "Ваши Shazam, то, что играет радиостанция, песня из TikTok или Топ-100 страны, сразу в плейлист."
one6_href: "/guide/shazam"
one_more: "Как это работает"
