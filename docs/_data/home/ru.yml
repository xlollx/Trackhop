docker_intro: '<strong>Docker</strong> <span class="stage">бета</span>, для домашнего сервера, NAS или Raspberry Pi:'
docker_password: pridumayte-svoy
docker_after: 'Затем откройте <code>http://127.0.0.1:8080</code>. Чтобы обновиться, скачайте образ и снова запустите контейнер: ваши синхронизации останутся в томе. Настройки, Docker Compose и что там работает: <a href="/guide/docker"><strong>руководство по Docker</strong></a>. Также есть на <a href="https://hub.docker.com/r/xlollx/trackhop">Docker Hub</a> как <code>xlollx/trackhop</code>. На <a href="/guide/playlist-sync-nas">NAS (Synology, Unraid, TrueNAS)</a> или <a href="/guide/self-hosted-playlist-sync">рядом с Navidrome, Jellyfin или Plex</a>. Для всей семьи — <a href="/guide/docker#several-people-on-one-server">отдельный аккаунт каждому</a>: каждый входит сам и получает свои сервисы и синхронизации.'
azure_before: '<strong>В Azure</strong> <span class="stage">бета</span>, без сервера дома:'
azure_after: 'создаёт Trackhop в вашей собственной подписке Azure (Container Apps, HTTPS, данные в Azure Files). Оплата идёт с вашей подписки: около 5 &#36; в месяц в большинстве регионов, если между синхронизациями он простаивает, и до 15 &#36;, если он постоянно занят (оценка по прайс-листу Azure для Container Apps после ежемесячного бесплатного лимита; хранилище стоит копейки). <a href="/guide/docker#on-azure-beta">Подробнее</a>.'
both_have: "В обеих версиях — оформление как в приложении, проверка ненайденных треков, файловые плейлисты в любом формате и Инструменты из приложения: экспорт, полные резервные копии (в том числе по расписанию), дубликаты, недоступные треки, ИИ-плейлисты и ваша статистика."
data_title: Как Trackhop использует ваши данные
data1: "Trackhop подключается к выбранным вами музыкальным сервисам (Spotify, YouTube Music, Apple Music, Amazon Music, TIDAL, Deezer, личные серверы) через собственный вход каждого сервиса. Он читает ваши плейлисты и их треки, а когда вы запускаете или планируете синхронизацию, создаёт плейлисты и добавляет или удаляет треки в вашем собственном аккаунте. Для YouTube Music через API Google это означает YouTube Data API с разрешением <code>youtube</code>, которое используется только для ваших плейлистов и только на вашем устройстве."
data2: 'Токены доступа хранятся в зашифрованном виде на телефоне и никогда не передаются ни разработчику Trackhop, ни третьим лицам. Сервера Trackhop не существует. Подробности — в <a href="/privacy-policy">политике конфиденциальности</a>.'
start_title: Начать
start_intro: 'Android 8.0 или новее, на английском, итальянском, французском, немецком, испанском, португальском, польском, русском, турецком, китайском, японском и корейском. Не знаете, какую сборку выбрать? <a href="/guide/versions">Какой Trackhop?</a> сравнивает их. <a href="/guide/">Руководство</a> проведёт через первую синхронизацию и частые ошибки; если что-то работает не так, как описано, <em>Журнал → Сообщить на GitHub</em> откроет отчёт с уже заполненными подробностями.'
start_apk: или APK с GitHub
step_by_step: 'Пошагово: <a href="/guide/spotify-to-youtube-music">из Spotify в YouTube Music</a> · <a href="/guide/apple-music-to-spotify">из Apple Music в Spotify</a> · <a href="/guide/spotify-to-tidal">из Spotify в TIDAL</a> · <a href="/guide/spotify-to-apple-music">из Spotify в Apple Music</a> · <a href="/guide/youtube-music-to-spotify">из YouTube Music в Spotify</a> · <a href="/guide/deezer-to-spotify">из Deezer в Spotify</a> · <a href="/guide/amazon-music-to-spotify">из Amazon Music в Spotify</a> · <a href="/guide/spotify-to-navidrome-jellyfin">из Spotify в Navidrome, Jellyfin или Plex</a> · <a href="/guide/export-playlist-csv">плейлист в CSV или M3U</a> · <a href="/guide/shazam">ваши Shazam в плейлисте</a>. Руководство на русском: <a href="/guide/perenos-pleylistov">Перенос плейлистов между Spotify, YouTube Music, Apple Music и Deezer бесплатно</a>.'
no_phone: 'Нет под рукой Android-телефона? <a href="#docker">Попробуйте Trackhop Desktop</a> на Windows или Linux либо версию для Docker.'
play_bridge: 'Пользуетесь версией из Google Play или AppGallery? <a href="https://github.com/xlollx/Trackhop-Bridge/releases/latest"><strong>Скачайте Trackhop Bridge</strong></a> — плагин, который добавляет YouTube Music, Amazon Music, а также Spotify и Apple Music без ключей разработчика (неофициальные веб-интерфейсы: сначала прочитайте его примечания).'
thanks_title: Спасибо
thanks_how: 'всем, благодаря кому Trackhop остаётся бесплатным. Хотите видеть здесь своё имя? <a href="https://ko-fi.com/xlollx" target="_blank" rel="noopener">Ko-fi</a> (карта или PayPal) или <a href="https://github.com/sponsors/xlollx" target="_blank" rel="noopener">GitHub Sponsors</a>.'
renamed: '<strong>Songport теперь называется Trackhop.</strong> То же приложение, тот же код, те же обновления: изменилось только название, потому что в той же области работает посторонний сервис под названием «SongPort». Установленное приложение обновится как обычно и сохранит все данные, а старые ссылки продолжат работать.'
