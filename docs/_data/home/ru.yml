title: Trackhop
description: Держите плейлисты одинаковыми в Spotify, Apple Music, YouTube Music, Amazon Music, TIDAL, Deezer и на собственном музыкальном сервере. На телефоне, без аккаунта, без сервера.
h1: "Ваши плейлисты —<br>везде."
lead: Trackhop синхронизирует плейлисты между музыкальными сервисами — вручную или по расписанию.
sub: "Бесплатно и с открытым исходным кодом. Без аккаунта, без сервера, без подписки: всё работает на вашем телефоне."
