why_title: Почему не онлайн-сервис для переноса?
why_intro: 'Soundiiz, TuneMyMusic и FreeYourMusic хороши для разового переезда. Trackhop нужен, чтобы плейлисты оставались согласованными со временем, и при этом не отдавать никому свои аккаунты. Сравнение: <a href="/guide/soundiiz-alternative">Trackhop и Soundiiz</a>, <a href="/guide/tunemymusic-alternative">Trackhop и TuneMyMusic</a>.'
why_them: Онлайн-сервисы для переноса
