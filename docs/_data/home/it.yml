title: Trackhop
description: Mantieni le tue playlist identiche su Spotify, Apple Music, YouTube Music, Amazon Music, TIDAL, Deezer e il tuo server musicale. Sul telefono, senza account e senza server.
h1: "Le tue playlist,<br>ovunque."
lead: Trackhop tiene sincronizzate le playlist tra i servizi musicali, a mano o in automatico.
sub: "Gratis e open source. Niente account, niente server, niente abbonamento: tutto gira sul tuo telefono."
