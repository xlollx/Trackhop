docker_intro: '<strong>Docker</strong> <span class="stage">beta</span>, per un server di casa, un NAS o un Raspberry Pi:'
docker_password: scegline-una
docker_after: 'Poi apri <code>http://127.0.0.1:8080</code>. Per aggiornare, scarica l''immagine e riavvia il container: le sync restano nel volume. Impostazioni, Docker Compose e cosa funziona lì: <a href="/guide/docker"><strong>la guida a Docker</strong></a>. Anche su <a href="https://hub.docker.com/r/xlollx/trackhop">Docker Hub</a> come <code>xlollx/trackhop</code>. Su un <a href="/guide/playlist-sync-nas">NAS (Synology, Unraid, TrueNAS)</a>, o <a href="/guide/self-hosted-playlist-sync">accanto a Navidrome, Jellyfin o Plex</a>. Per tutta la famiglia, <a href="/guide/docker#several-people-on-one-server">un account a testa</a>: ognuno accede e ha i propri servizi e le proprie sync.'
azure_before: '<strong>Su Azure</strong> <span class="stage">beta</span>, senza un server in casa:'
azure_after: 'crea Trackhop nel tuo abbonamento Azure (Container Apps, HTTPS, dati su Azure Files). Addebitato sul tuo abbonamento: circa &#36;5 al mese nella maggior parte delle regioni se resta inattivo tra una sync e l''altra, fino a circa &#36;15 se è sempre occupato (stima dai prezzi di listino di Azure per Container Apps dopo la quota gratuita mensile; lo spazio di archiviazione costa pochi centesimi). <a href="/guide/docker#on-azure-beta">Altro</a>.'
both_have: "Entrambi hanno l'aspetto dell'app, la revisione dei brani non trovati, le playlist su file in tutti i formati e gli Strumenti dell'app: esportazione, backup completi (anche programmati), duplicati, brani non riproducibili, playlist con l'AI e I tuoi numeri."
data_title: Come Trackhop usa i tuoi dati
data1: "Trackhop si collega ai servizi musicali che scegli (Spotify, YouTube Music, Apple Music, Amazon Music, TIDAL, Deezer, server personali) con l'accesso di ciascun servizio. Legge le tue playlist e i loro brani e, quando avvii o programmi una sync, crea playlist e aggiunge o rimuove brani nel tuo account. Per YouTube Music tramite l'API di Google si tratta della YouTube Data API con il permesso <code>youtube</code>, usato solo per le tue playlist e solo sul tuo dispositivo."
data2: 'I token di accesso sono salvati cifrati sul telefono e non vengono mai inviati allo sviluppatore di Trackhop né a terzi. Non esiste un server di Trackhop. Dettagli nell''<a href="/privacy-policy">informativa sulla privacy</a>.'
start_title: Inizia
start_intro: 'Android 8.0 o successivo, in inglese, italiano, francese, tedesco, spagnolo, portoghese, polacco, russo, turco, cinese, giapponese e coreano. Non sai quale versione prendere? <a href="/guide/versions">Quale Trackhop?</a> le mette a confronto. La <a href="/guide/">guida</a> accompagna nella prima sync e negli errori più comuni; se qualcosa non funziona come descritto, <em>Registro → Segnala su GitHub</em> apre una segnalazione con i dettagli già compilati.'
start_apk: o l'APK da GitHub
step_by_step: 'Passo per passo: <a href="/guide/spotify-to-youtube-music">da Spotify a YouTube Music</a> · <a href="/guide/apple-music-to-spotify">da Apple Music a Spotify</a> · <a href="/guide/spotify-to-tidal">da Spotify a TIDAL</a> · <a href="/guide/spotify-to-apple-music">da Spotify ad Apple Music</a> · <a href="/guide/youtube-music-to-spotify">da YouTube Music a Spotify</a> · <a href="/guide/deezer-to-spotify">da Deezer a Spotify</a> · <a href="/guide/amazon-music-to-spotify">da Amazon Music a Spotify</a> · <a href="/guide/spotify-to-navidrome-jellyfin">da Spotify a Navidrome, Jellyfin o Plex</a> · <a href="/guide/export-playlist-csv">una playlist in CSV o M3U</a> · <a href="/guide/shazam">i tuoi Shazam in una playlist</a>. Guide in italiano: <a href="/guide/iniziare">Primi passi con Trackhop</a> · <a href="/guide/trasferire-playlist">Trasferire playlist tra Spotify, YouTube Music, Apple Music e Amazon Music</a> · <a href="/guide/trasferire-playlist-spotify-youtube-music">Da Spotify a YouTube Music gratis</a> · <a href="/guide/trasferire-playlist-spotify-apple-music">Da Spotify ad Apple Music gratis</a> · <a href="/guide/alternativa-soundiiz">Alternativa gratuita a Soundiiz e TuneMyMusic</a>.'
no_phone: 'Non hai un telefono Android a portata di mano? <a href="#docker">Prova Trackhop Desktop</a> su Windows o Linux, oppure la versione Docker.'
play_bridge: 'Usi la versione di Google Play? <a href="https://github.com/xlollx/Trackhop-Bridge/releases/latest"><strong>Scarica Trackhop Bridge</strong></a>, il plugin che aggiunge YouTube Music, Amazon Music, e Spotify e Apple Music senza chiavi sviluppatore (interfacce web non ufficiali: leggi prima le sue note).'
thanks_title: Grazie
thanks_how: 'alle persone che mantengono Trackhop gratuito. Vuoi il tuo nome qui? <a href="https://ko-fi.com/xlollx" target="_blank" rel="noopener">Ko-fi</a> o <a href="https://github.com/sponsors/xlollx" target="_blank" rel="noopener">GitHub Sponsors</a>.'
renamed: '<strong>Songport ora si chiama Trackhop.</strong> Stessa app, stesso codice, stessi aggiornamenti: è cambiato solo il nome, perché un servizio non collegato chiamato "SongPort" opera nello stesso ambito. L''app installata si aggiorna normalmente e conserva tutti i suoi dati, e i vecchi link continuano a funzionare.'
