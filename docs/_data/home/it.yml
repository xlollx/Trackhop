also_title: Anche su computer o NAS
also_intro: "Vuoi provarlo senza telefono, o tenere le sync attive su una macchina sempre accesa? Lo stesso motore gira sul tuo computer e su un server, con una pagina web per collegare i servizi e creare le sync. Entrambi sono in <strong>beta</strong>: funzionano per l'uso di tutti i giorni ma sono ancora giovani, quindi tieni una copia della tua configurazione e facci sapere cosa non va."
desktop_intro: '<strong>Trackhop Desktop</strong> per Windows, macOS e Linux: si installa come un qualsiasi programma, senza Docker né Java, senza diritti di amministratore. Sta accanto all''orologio ed esegue le sync programmate finché il computer è acceso. Versione %V% (<a href="https://github.com/xlollx/Trackhop/releases/tag/server-v%V%">cosa contiene</a>).'
