# The texts around trackhop.org/services (the table itself is _data/services.yml) and
# trackhop.org/whats-new (the notes are _data/releases.json), by language.
services:
  en:
    title: "Music services Trackhop works with: what it can do on each"
    description: "Spotify, YouTube Music, Apple Music, Amazon Music, TIDAL, Deezer, Qobuz, SoundCloud, Navidrome, Jellyfin, Plex and more: what Trackhop reads and writes on each service, how you connect it, and which versions have it."
    kicker: Trackhop · Services
    h1: Every music service Trackhop works with
    lead: What Trackhop can do on each service, how you connect it, and which versions of Trackhop have it.
    legend: "<b>Read</b> = use it as a source · <b>Write</b> = create playlists and add songs · <b>Remove</b> = mirror removals"
    jump: "Jump to:"
    cols: [Service, Read, Write, Remove, How you connect, Where]
    quick: '"Quick sign-in" goes through the service''s own web player: it is not an official interface, so it lives in the GitHub and F-Droid apps, Desktop and Docker, and for the Google Play and AppGallery apps in the <a href="https://github.com/xlollx/Trackhop-Bridge">Trackhop Bridge</a> plugin. "All versions" means the Google Play, GitHub and F-Droid apps, Trackhop Desktop and Docker.'
    more: '<a href="/guide/versions">Which version do I need?</a> · <a href="https://github.com/xlollx/Trackhop#supported-services-and-their-limits">Keys and limits of each service</a>'
  it:
    title: "I servizi musicali con cui funziona Trackhop: cosa fa su ognuno"
    description: "Spotify, YouTube Music, Apple Music, Amazon Music, TIDAL, Deezer, Qobuz, SoundCloud, Navidrome, Jellyfin, Plex e altri: cosa legge e scrive Trackhop su ogni servizio, come lo colleghi e quali versioni lo hanno."
    kicker: Trackhop · Servizi
    h1: Tutti i servizi musicali con cui funziona Trackhop
    lead: Cosa può fare Trackhop su ogni servizio, come lo colleghi e quali versioni di Trackhop lo hanno.
    legend: "<b>Legge</b> = lo usa come sorgente · <b>Scrive</b> = crea playlist e aggiunge brani · <b>Toglie</b> = riporta le rimozioni"
    jump: "Vai a:"
    cols: [Servizio, Legge, Scrive, Toglie, Come lo colleghi, Dove]
    quick: 'L''"accesso rapido" passa dal web player del servizio: non è un''interfaccia ufficiale, quindi c''è nelle app GitHub e F-Droid, in Desktop e Docker, e per le app di Google Play e AppGallery nel plugin <a href="https://github.com/xlollx/Trackhop-Bridge">Trackhop Bridge</a>. "Tutte le versioni" sono le app di Google Play, GitHub e F-Droid, Trackhop Desktop e Docker.'
    more: '<a href="/guide/versions">Quale versione mi serve?</a> · <a href="https://github.com/xlollx/Trackhop#supported-services-and-their-limits">Chiavi e limiti di ogni servizio</a> (in inglese)'
  es:
    title: "Los servicios de música con los que funciona Trackhop: qué hace en cada uno"
    description: "Spotify, YouTube Music, Apple Music, Amazon Music, TIDAL, Deezer, Qobuz, SoundCloud, Navidrome, Jellyfin, Plex y más: qué lee y escribe Trackhop en cada servicio, cómo lo conectas y qué versiones lo tienen."
    kicker: Trackhop · Servicios
    h1: Todos los servicios de música con los que funciona Trackhop
    lead: Qué puede hacer Trackhop en cada servicio, cómo lo conectas y qué versiones de Trackhop lo tienen.
    legend: "<b>Lee</b> = lo usa como origen · <b>Escribe</b> = crea playlists y añade canciones · <b>Quita</b> = refleja lo que quitas"
    jump: "Ir a:"
    cols: [Servicio, Lee, Escribe, Quita, Cómo lo conectas, Dónde]
    quick: 'El "acceso rápido" pasa por el reproductor web del propio servicio: no es una interfaz oficial, así que está en las apps de GitHub y F-Droid, en Desktop y Docker, y para las apps de Google Play y AppGallery en el plugin <a href="https://github.com/xlollx/Trackhop-Bridge">Trackhop Bridge</a>. "Todas las versiones" son las apps de Google Play, GitHub y F-Droid, Trackhop Desktop y Docker.'
    more: '<a href="/guide/versions">¿Qué versión necesito?</a> (en inglés) · <a href="https://github.com/xlollx/Trackhop#supported-services-and-their-limits">Claves y límites de cada servicio</a> (en inglés)'
  pt:
