kicker: Trackhop · 도구
choose: 파일 선택
noscript: 이 도구는 브라우저에서 실행되며 JavaScript가 필요해요. 어떤 경우에도 아무것도 전송되지 않아요.
get: Trackhop 받기
priv: "이 페이지에서만 읽어요: 아무것도 업로드되지 않아요"
formats: CSV, M3U, XSPF, JSPF, Apple Music 또는 iTunes 플레이리스트, 일반 목록 등
compare:
  title: "두 플레이리스트 비교: 어디에 무엇이 빠졌는지"
  description: "플레이리스트 파일 두 개(CSV, M3U, XSPF, JSPF, iTunes XML)를 놓으면 한쪽에만 있는 곡과 양쪽에 다 있는 곡을 보여 줘요. 브라우저에서 처리: 아무것도 업로드되지 않아요. 무료, 계정 불필요."
  h1: 두 플레이리스트 비교
  lead: 플레이리스트 파일 두 개를 넣으면 어디에 무엇이 빠졌는지 보여 줘요. 옮긴 뒤 확인하거나 두 플레이리스트의 공통점을 볼 때 편해요.
  a: 플레이리스트 A
  b: 플레이리스트 B
  drop: 여기에 파일을 놓거나 선택하세요
  cta: 빠진 곡을 대신 추가하고 두 플레이리스트를 계속 똑같이 유지하고 싶나요?
  how_h: 곡을 맞추는 방법
  how: "두 파일 모두 녹음 코드인 ISRC가 있으면 그것으로, 없으면 대소문자, 악센트, \"feat.\", \"Remastered\"를 무시한 제목과 아티스트로 맞추고 길이도 비교해요. 라이브, 어쿠스틱, 리믹스 버전은 Trackhop 앱처럼 다른 곡으로 봐요."
  stays_h: 파일은 어떻게 되나요
  stays: "브라우저가 이 페이지에서 읽어요. Trackhop이나 다른 누구에게도 보내지 않아요. 계정도, 쿠키도, 누가 이 페이지를 쓰는지에 대한 통계도 없어요."
  guide: '플레이리스트가 파일이 아니라 서비스에 있나요? <a href="/convert">Convert</a>는 대부분 서비스의 내보내기 파일을 읽고, <a href="/guide/playlist-transfer-ko">앱은 어떤 플레이리스트든 내보낼 수 있어요</a>.'
duplicates:
  title: "플레이리스트 파일에서 중복 곡 찾아 지우기"
  description: "플레이리스트 파일(CSV, M3U, XSPF, JSPF, iTunes XML)을 놓으면 두 번 들어간 곡을 묶어 보여 주고, 남길 곡을 고르면 정리된 파일을 돌려줘요. 브라우저에서, 무료, 계정 불필요."
  h1: 중복 곡 찾아 지우기
  lead: 플레이리스트 파일을 놓으세요. 두 번 이상 들어간 곡을 묶어 보여 주고, 남길 곡을 고르면 정리된 파일을 돌려줘요.
  drop: 여기에 플레이리스트 파일을 놓거나 선택하세요
  cta: 플레이리스트가 Spotify, YouTube Music, TIDAL, Deezer에 있나요? 앱에서 바로 정리할 수 있어요.
  what_h: 중복으로 보는 것
  what:
    - "<strong>같은 녹음</strong>: 같은 ISRC. 하나는 앨범, 하나는 싱글이나 컴필레이션에서 왔어도 마찬가지예요."
    - "<strong>같은 제목과 같은 아티스트</strong>: 대소문자, 악센트, \"feat.\", \"Remastered\"는 무시하고 길이가 맞는 경우."
    - "<strong>다른 버전</strong>은 아니에요: 라이브, 어쿠스틱, 리믹스는 따로인 곡이에요."
  stays_h: 파일은 어떻게 되나요
  stays: "브라우저가 이 페이지에서 읽고 정리된 파일도 여기서 만들어요. 각 묶음에서는 다른 것을 고르지 않으면 첫 번째 곡이 남고, 플레이리스트 순서는 바뀌지 않아요. Trackhop이나 다른 누구에게도 아무것도 보내지 않아요."
  guide: '앱에서 서비스에 바로 적용하는 방법: <a href="/guide/remove-duplicates-spotify">Remove duplicate songs</a> (영어).'
button:
  title: "사이트나 블로그용 \"어떤 서비스에서든 듣기\" 버튼"
  description: "곡이나 앨범 링크를 붙여 넣으면 블로그, 뉴스레터, 사이트에 넣을 버튼을 만들어 줘요. 독자는 자기가 쓰는 서비스에서 곡을 열어요. 단순한 HTML, 스크립트 없음, 추적 없음. 무료."
  h1: '"어떤 서비스에서든 듣기" 버튼'
  lead: 블로그, 뉴스레터, 사이트에. 독자는 어떤 서비스를 쓰든 그 서비스에서 곡을 열어요.
  label: 곡이나 앨범 링크 붙여 넣기 (Spotify, Apple Music, Deezer)
  go: 버튼 만들기
  style: 스타일
  styles: {dark: 어둡게, light: 밝게, violet: 보라}
  brand: "모양"
  brands: {name: "로고와 이름", logo: "로고만 (간결)"}
  text: 버튼 글자
  default_text: 어떤 서비스에서든 듣기
  preview: 미리 보기
  code: 붙여 넣을 코드
  copy: 코드 복사
  copy_link: 링크만 복사
  how_h: 버튼이 하는 일
  how: '클릭하면 그 곡으로 <a href="/link">A link for every service</a>가 열려요. 독자가 Spotify, Apple Music, YouTube Music, Deezer, TIDAL, Amazon Music 등 서비스를 고르면 거기서 곡이 열려요.'
  stays_h: 추적 없음
  stays: "버튼은 단순한 HTML이에요. 스크립트도, Trackhop의 이미지나 글꼴도, 쿠키도 없어요. 누군가 클릭하기 전에는 Trackhop에 아무것도 가지 않고, 클릭해도 곡을 찾기 위한 링크만 가요. Trackhop은 클릭 수를 세지 않아요."
