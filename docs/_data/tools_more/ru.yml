kicker: Trackhop · Инструменты
choose: Выбрать файл
noscript: Этот инструмент работает в вашем браузере, и ему нужен JavaScript. В любом случае ничего никуда не отправляется.
get: Скачать Trackhop
priv: "Читается только на этой странице: ничего не загружается"
formats: CSV, M3U, XSPF, JSPF, плейлист Apple Music или iTunes, простой список и другие
compare:
  title: "Сравнить два плейлиста: чего и где не хватает"
  description: "Перетащите два файла плейлистов (CSV, M3U, XSPF, JSPF, iTunes XML) и посмотрите, какие песни есть только в одном, а какие в обоих. В вашем браузере: ничего не загружается. Бесплатно, без аккаунта."
  h1: Сравнить два плейлиста
  lead: Два файла плейлистов — и видно, чего где не хватает. Удобно после переноса или чтобы узнать, что общего у двух плейлистов.
  a: Плейлист A
  b: Плейлист B
  drop: Перетащите сюда файл или выберите его
  cta: Хотите, чтобы недостающие песни добавлялись сами, а два плейлиста оставались одинаковыми?
  how_h: Как сопоставляются песни
  how: "По ISRC, коду записи, если он есть в обоих файлах; иначе по названию и исполнителям, без учёта регистра, диакритики, «feat.» или «Remastered», при совпадающей длительности. Концертная, акустическая версия или ремикс считается другой песней, как в приложении Trackhop."
  stays_h: Что происходит с вашими файлами
  stays: "Ваш браузер читает их на этой странице. Они не отправляются ни в Trackhop, ни кому-либо ещё; нет аккаунта, нет cookie и нет статистики о том, кто пользуется страницей."
  guide: 'Ваши плейлисты в сервисе, а не в файле? <a href="/convert">Convert</a> читает экспорт большинства сервисов, а <a href="/guide/perenos-pleylistov">приложение экспортирует любой плейлист</a>.'
duplicates:
  title: "Найти и удалить дубликаты в файле плейлиста"
  description: "Перетащите файл плейлиста (CSV, M3U, XSPF, JSPF, iTunes XML): песни, которые есть в нём дважды, группируются, вы выбираете, какую копию оставить, и получаете очищенный файл. В вашем браузере, бесплатно, без аккаунта."
  h1: Найти и удалить дубликаты
  lead: Перетащите файл плейлиста. Песни, которые встречаются больше одного раза, группируются, вы выбираете, какую копию оставить, и получаете очищенный файл.
  drop: Перетащите сюда файл плейлиста или выберите его
  cta: Ваш плейлист в Spotify, YouTube Music, TIDAL или Deezer? Приложение почистит его прямо там.
  what_h: Что считается дубликатом
  what:
    - "<strong>Та же запись</strong>: тот же ISRC, даже если одна копия из альбома, а другая — из сингла или сборника."
    - "<strong>То же название и те же исполнители</strong>, без учёта регистра, диакритики, «feat.» или «Remastered», при совпадающей длительности."
    - "Никогда <strong>другая версия</strong>: концертная, акустическая запись или ремикс остаётся отдельной песней."
  stays_h: Что происходит с вашим файлом
  stays: "Ваш браузер читает его на этой странице и там же записывает очищенный файл. В каждой группе остаётся первая копия, если вы не выберете другую, и порядок плейлиста не меняется. Ничего не отправляется ни в Trackhop, ни кому-либо ещё."
  guide: 'По шагам в приложении, прямо в сервисе: <a href="/guide/remove-duplicates-spotify">Remove duplicate songs</a> (на английском).'
button:
  title: "Кнопка «Слушать в любом сервисе» для вашего сайта или блога"
  description: "Вставьте ссылку на песню или альбом и получите кнопку для блога, рассылки или сайта: читатели откроют песню в сервисе, которым пользуются. Простой HTML, без скриптов, без слежки. Бесплатно."
  h1: Кнопка «Слушать в любом сервисе»
  lead: Для блога, рассылки или сайта. Читатели открывают песню в сервисе, которым пользуются, каким бы он ни был.
  label: Вставьте ссылку на песню или альбом (Spotify, Apple Music или Deezer)
  go: Сделать кнопку
  style: Стиль
  styles: {dark: Тёмная, light: Светлая, violet: Фиолетовая}
  text: Текст на кнопке
  default_text: Слушать в любом сервисе
  preview: Предпросмотр
  code: Код для вставки
  copy: Скопировать код
  copy_link: Скопировать только ссылку
  how_h: Что делает кнопка
  how: 'Клик открывает <a href="/link">A link for every service</a> с вашей песней: читатель выбирает Spotify, Apple Music, YouTube Music, Deezer, TIDAL, Amazon Music или другой сервис, и песня открывается там.'
  stays_h: Без слежки
  stays: "Кнопка — это простой HTML: без скриптов, без картинок и шрифтов от Trackhop, без cookie. В Trackhop ничего не попадает, пока кто-то не нажмёт, и тогда только ссылка на песню, чтобы её найти. Trackhop не считает клики."
