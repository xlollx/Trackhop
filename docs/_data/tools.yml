it:
  home: /it/
  kicker: Trackhop · Strumenti
  choose: Scegli un file
  cancel: Annulla
  noscript: Questo strumento gira nel tuo browser e ha bisogno di JavaScript. In ogni caso non viene inviato niente.
  get: Scarica Trackhop
  wrapped:
    h1: Il tuo Wrapped, quando vuoi
    lead: "Il tuo anno in musica, dall'esportazione dei tuoi dati: chi hai ascoltato di più, quando ascolti e i giorni che hanno lasciato il segno."
    tabs: Da dove viene l'esportazione
    years: Anno
    priv: "Letto solo in questa pagina: non viene caricato niente"
    another: Scegli un altro file
    gets_label: Cosa vedrai
    gets:
      - Il tuo artista dell'anno
      - I minuti, mese per mese
      - I brani più ascoltati
      - Il tuo orologio degli ascolti
      - Il primo brano dell'anno
      - La serie più lunga
      - Una scheda da condividere
    top_eyebrow: Quelli a cui torni sempre
    top_h: I tuoi primi cinque
    top_artists: Artisti più ascoltati
    top_songs: Brani più ascoltati
    clock_eyebrow: Il tuo orologio degli ascolti
    clock_h: Quando c'è la musica
    pattern: Il tuo ritmo
    parts_label: Quota degli ascolti per parte della giornata
    weekday_h: Per giorno della settimana
    numbers: Vedi le ore in numeri
    mom_eyebrow: Giorni che hanno lasciato il segno
    card_eyebrow: Portala con te
    card_h: La tua scheda
    look: Scegli uno stile
    looks:
      beam: Raggio
      violet: Viola
      paper: Carta
      night: Notte
    card_note: "Le due immagini sono disegnate in questa pagina e le salvi tu. Mostrano solo quello che vedi qui: il tuo totale, gli artisti e i brani più ascoltati e l'orologio degli ascolti."
    save_story: Salva per le storie
    save_square: Salva quadrata per i post
    cta: Trackhop tiene le tue playlist allineate su ogni servizio, da sole.
    where_h: Da dove si prende il file
    where:
      - "<strong>Spotify</strong>: su spotify.com, <em>Account › Privacy › Scarica i tuoi dati</em>, spunta <em>Cronologia di streaming estesa</em>. In qualche giorno arriva per e-mail il link a <code>my_spotify_data.zip</code>. Trascina lo .zip così com'è, oppure i file <code>Streaming_History_Audio_….json</code> che contiene."
      - "<strong>Apple Music</strong>: su privacy.apple.com, <em>Richiedi una copia dei tuoi dati › Informazioni sui servizi multimediali Apple</em>. Nell'archivio apri <em>Apple Music Activity</em> e trascina <code>Apple Music Play Activity.csv</code> (va bene anche lo .zip in cui arriva)."
      - "<strong>YouTube Music</strong>: su takeout.google.com scegli <em>YouTube e YouTube Music</em>, tieni solo la <em>cronologia</em> e imposta il formato <em>JSON</em> (è HTML se non lo cambi). Trascina <code>watch-history.json</code> o lo .zip di Takeout. Google dà gli ascolti, non la loro durata: qui la pagina conta gli ascolti, non i minuti."
    stays_h: Cosa succede al tuo file
    stays: "Lo apre il tuo browser in questa pagina e lo legge lì, un pezzo alla volta, così funziona anche una cronologia grande. Non viene inviato a Trackhop né a nessun altro. La pagina non ha account, cookie o statistiche su chi la usa; la scheda è disegnata qui e la salvi tu. Chiudi la scheda del browser e non resta niente."
    guide: 'L''app Trackhop crea una scheda così dalle tue playlist, su qualsiasi servizio: <a href="/guide/wrapped-quando-vuoi">Il tuo Wrapped, quando vuoi</a>.'
  convert:
    h1: Convertire un file di playlist
    lead: CSV, M3U, PLS, XSPF, JSPF, WPL/ZPL, JSON, una libreria di Apple Music/iTunes, una collezione di rekordbox, un'esportazione di Shazam o un elenco semplice. Di qualsiasi dimensione.
    drop: Trascina qui un file, oppure sceglilo
    priv: "Convertito solo in questa pagina: non viene caricato niente"
    cta: Lo vuoi su Spotify, Apple Music o YouTube Music invece che in un file?
    reads_h: Cosa legge
    reads:
      - "<strong>CSV</strong>, con virgole, punti e virgola o tabulazioni: quello di Trackhop, Exportify, TuneMyMusic, Soundiiz, l'esportazione in testo di Apple Music e la libreria di Shazam con la sua riga di titolo."
      - "<strong>M3U e M3U8</strong> con o senza <code>#EXTINF</code>, <strong>PLS</strong>, <strong>XSPF</strong>, <strong>JSPF</strong> e altro <strong>JSON</strong>, <strong>OPML</strong> delle iscrizioni ai podcast."
      - "<strong>Una libreria di Apple Music o iTunes</strong> (<em>File › Libreria › Esporta libreria</em>): scegli quali playlist prendere. Le cartelle fanno da intestazione, le playlist smart partono senza spunta, gli elenchi propri della libreria restano fuori."
      - "<strong>Un elenco semplice</strong>, un brano per riga: <code>Artista - Titolo</code>."
    writes_h: Cosa scrive
    writes: "CSV (titolo, artista, album, durata, ISRC), M3U8, XSPF, JSPF o testo semplice. Più playlist escono in un unico .zip. Il formato è riconosciuto dal file con le stesse regole dell'app Trackhop: un file che si converte qui si importa lì."
    stays_h: Cosa succede al tuo file
    stays: "Lo legge il tuo browser in questa pagina, un pezzo alla volta, e lì scrive il nuovo file. Non viene inviato a Trackhop né a nessun altro; non ci sono account, cookie o statistiche su chi usa la pagina. Un file tagliato o illeggibile dà un messaggio e niente da scaricare."
    guide: 'Per portare la playlist su un altro servizio e tenerla allineata: <a href="/guide/export-playlist-csv">esporta e importa con l''app</a> (in inglese).'
  link:
    h1: Un link per ogni servizio
    lead: Ti hanno mandato una canzone su un servizio che non usi? Incolla il link, o scrivi il brano, e aprilo dove ascolti tu.
    label: Incolla un link, o scrivi un brano e il suo artista
    placeholder: open.spotify.com/track/… o Fleetwood Mac Dreams
    paste: Incolla
    go: Cerca
    priv: "Non viene salvato niente: la ricerca va dal tuo browser direttamente ai servizi"
    priv_short: Non viene salvato niente
    again: Prova un altro link
    reads_h: I link che sa leggere
    apple: Apple Music o iTunes
    full: Tutti i dettagli
    title_only: Titolo e copertina
    reads_note: Un brano o un album alla volta. Da un link di Spotify la pagina riceve solo il titolo e la copertina. Dove può trova l'artista dal codice a barre o dalla copertina; dove non può fa un'ipotesi e ti lascia correggere l'artista.
    goes_h: Dove ti può portare
    exact: Esatto
    search: Ricerca
    legend_exact: Il pulsante apre proprio quel brano.
    legend_search: Il pulsante apre la ricerca di quel servizio con artista e titolo già scritti. Quei servizi non lasciano cercare un brano a una pagina senza un accesso.
    cta: Devi spostare più di un brano? L'app Trackhop lo fa per playlist intere, e aggiunge "Link per ogni servizio" al menu di condivisione.
    how_h: Come trova il brano
    how: "Il tuo browser chiede ai cataloghi pubblici dei servizi musicali notizie sul link che hai incollato: di chi è il brano, in quale album sta, quanto dura. Con questo prepara un pulsante per ogni servizio. Un pulsante dice Esatto solo quando un codice a barre, un ISRC, la copertina o la durata mostrano che è la stessa cosa, e dice quale. Per un link di Spotify chiede anche a MusicBrainz, l'enciclopedia libera della musica, il codice a barre dell'album. Dove MusicBrainz, ListenBrainz o Wikidata conoscono la pagina del brano su un altro servizio, quel pulsante la apre e dice da dove viene il link."
    why_h: Perché alcuni pulsanti dicono Ricerca
    why: Quasi tutti i servizi lasciano cercare un brano a una pagina solo dopo un accesso, e questa pagina non te lo chiede mai. Per quelli apre la loro ricerca con artista e titolo già scritti, e lo dice sul pulsante.
    stays_h: Cosa resta a te
    stays: Dietro questa pagina non c'è nessun server di Trackhop. Il link va dal tuo browser ai servizi su cui viene cercato, e quando chiudi la scheda non resta niente.
    stays_db: Per trovare i link esatti il tuo browser chiede anche a MusicBrainz, ListenBrainz e Wikidata, database musicali aperti.
    button: 'Vuoi un pulsante così sul tuo blog o sito? <a href="/it/button">Crea un pulsante "Ascolta su qualsiasi servizio"</a>.'
