        nothing:
          h: "Nessun brano trovato per “{q}”."
          p: Controlla come è scritto, o prova solo il titolo e l'artista, senza altre parole.
        not-link:
          h: Questo non sembra un link.
          p: "Nell'app di musica usa Condividi › Copia link su un brano o su un album, poi incollalo qui."
        playlist:
          h: Questo è il link di una playlist. Questa pagina legge un brano o un album alla volta.
          tips:
            - Apri il brano che ti interessa dentro la playlist, copia il suo link e incolla quello.
            - "Per spostare tutta la playlist, {get}: l'app fa proprio questo."
        artist:
          h: Questo è il link di un artista. Questa pagina legge un brano o un album alla volta.
          tips:
            - Apri un brano o un album dell'artista, copia il suo link e incolla quello.
        podcast:
          h: Questo è il link di un podcast. Questa pagina legge brani e album.
          p: I podcast hanno nomi e cataloghi diversi su ogni servizio, quindi non c'è niente di affidabile con cui farli combaciare.
        other:
          h: Questo link non è un brano né un album.
          p: "Apri proprio il brano o l'album, usa Condividi › Copia link e incolla quello."
        short:
          h: Questo è un link breve, e una pagina web non può seguirlo.
          p: Aprilo, aspetta che compaia il brano, poi copia il link completo dalla barra degli indirizzi (o con Condividi › Copia link) e incollalo qui.
        site:
          h: Questa pagina non sa leggere i link di quel sito.
          p: Legge i link di brani e album di Apple Music, Deezer e Spotify. Se trovi il brano su uno di questi, incolla quel link.
        not-found:
          h: "{service} non conosce questo link."
          p: Il brano potrebbe essere stato tolto, oppure un pezzo del link si è perso per strada. Copialo di nuovo dall'app e riprova.
        no-answer:
          h: "{service} in questo momento non risponde."
          p: Non è stato fatto niente a metà. Aspetta un momento e premi di nuovo il pulsante.
        offline:
          h: Sei offline.
          p: Per cercare serve internet. Quando torni in linea, premi di nuovo il pulsante.
        unknown:
