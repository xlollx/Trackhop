ja:
  title: 'Google Play・AppGallery から Trackhop を入れましたか？'
  text: '<b>Trackhop Bridge</b> を追加すると、YouTube Music、Amazon Music、SoundCloud、LiveOne、Anghami、開発者キーなしの Spotify・Apple Music・Deezer、TikTok 動画の曲などが使えます。'
  note: 'GitHub 版と F-Droid 版には最初からすべて入っています。'
  which: 'どの Trackhop を使っていますか？'
ko:
  title: 'Google Play 또는 AppGallery에서 Trackhop을 설치했나요?'
  text: '<b>Trackhop Bridge</b>를 추가하세요: YouTube Music, Amazon Music, SoundCloud, LiveOne, Anghami, 개발자 키 없는 Spotify·Apple Music·Deezer, TikTok 영상 속 노래 등.'
  note: 'GitHub 및 F-Droid 버전에는 이미 모두 들어 있습니다.'
  which: '내 Trackhop은 어떤 버전인가요?'
zh:
  title: '从 Google Play 或 AppGallery 安装的 Trackhop？'
  text: '添加 <b>Trackhop Bridge</b>：YouTube Music、Amazon Music、SoundCloud、LiveOne、Anghami，无需开发者密钥的 Spotify、Apple Music 和 Deezer，TikTok 视频里的歌曲等。'
  note: 'GitHub 版和 F-Droid 版已全部内置。'
  which: '我用的是哪个 Trackhop？'
