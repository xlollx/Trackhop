# Card shown at the top of the guide pages (below the title): the Bridge plugin for the store
# versions of the Android app. Pages for Desktop, Docker, servers and iPhone set `bridge: false`.
en:
  title: 'Installed Trackhop from Google Play or AppGallery?'
  text: 'Add <b>Trackhop Bridge</b>: YouTube Music, Amazon Music, SoundCloud, LiveOne, Anghami, Spotify, Apple Music and Deezer without developer keys, songs from TikTok videos and more.'
  note: 'The GitHub and F-Droid versions already have all of it.'
  which: 'Which Trackhop do I have?'
it:
  title: 'Hai installato Trackhop da Google Play o AppGallery?'
  text: 'Aggiungi <b>Trackhop Bridge</b>: YouTube Music, Amazon Music, SoundCloud, LiveOne, Anghami, Spotify, Apple Music e Deezer senza chiavi da sviluppatore, le canzoni dei video TikTok e altro.'
  note: 'Le versioni GitHub e F-Droid hanno già tutto.'
  which: 'Quale Trackhop ho?'
es:
